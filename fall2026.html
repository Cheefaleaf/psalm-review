<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fall 2026 — The Fellowship CPC Youth</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0a0a0a;--white:#f5f2ec;--gold:#e8b84b;--gold-dark:#c49a2a;
  --card-bg:#141414;--border:rgba(255,255,255,0.08);--muted:#777;
  --raise:#1b1b1b;
  --display:'Bebas Neue',sans-serif;--body:'DM Sans',sans-serif;
}
body{background:var(--black);color:var(--white);font-family:var(--body);
  font-size:16px;line-height:1.6;overflow-x:hidden;min-height:100vh}
a{color:var(--gold);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;
  justify-content:space-between;padding:0 2rem;height:60px;
  background:rgba(10,10,10,.94);border-bottom:1px solid var(--border);backdrop-filter:blur(8px)}
.nav-logo{font-family:var(--display);font-size:18px;letter-spacing:3px;color:var(--gold)}
.nav-back{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:rgba(245,242,236,.45)}
.nav-back:hover{color:var(--white)}

main{padding-top:60px;min-height:100vh}
.pad{max-width:1080px;margin:0 auto;padding:0 2rem}

/* masthead */
.mast{padding:56px 0 30px;border-bottom:1px solid var(--border)}
.mast h1{font-family:var(--display);font-size:clamp(46px,8vw,86px);letter-spacing:2px;
  line-height:.92;color:var(--white)}
.mast h1 em{font-style:normal;color:var(--gold)}
.mast p{color:var(--muted);margin-top:10px;max-width:56ch;font-size:15px}

/* this week */
.now{padding:38px 0 10px}
.now+.now{padding-top:30px}
.now+.now .now-hd h2,.now+.now .now-hd .wknum{font-size:24px}
.now+.now .room{background:#111}
.now-hd{display:flex;align-items:baseline;gap:14px;margin-bottom:20px}
.now-hd h2{font-family:var(--display);font-size:30px;letter-spacing:2px}
.now-hd .wknum{font-family:var(--display);font-size:30px;color:var(--gold);letter-spacing:2px}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.room{background:var(--card-bg);border:1px solid var(--border);border-radius:4px;
  padding:22px;display:flex;flex-direction:column}
.room.past{opacity:.5}
.room .kicker{font-family:var(--display);letter-spacing:2px;font-size:15px;color:var(--gold)}
.room h3{font-size:23px;font-weight:500;line-height:1.25;margin:6px 0 2px}
.room .meta{color:var(--muted);font-size:13px;margin-bottom:16px}
.room .src{color:var(--muted);font-size:12px;margin-top:-12px;margin-bottom:16px}
.docs{display:flex;flex-direction:column;gap:1px;margin-top:auto}
.docrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:10px 12px;background:var(--raise);border-radius:3px;line-height:1.3}
.docrow:hover{background:#252525}
.docrow .lbl{flex:1;font-size:14.5px}
.docrow .kind{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.docrow.sheet{background:transparent;border:1px solid var(--border)}
.docrow.sheet:hover{background:var(--raise)}
.docrow.handout .lbl{font-weight:500}
.docrow.handout{box-shadow:inset 2px 0 0 var(--gold-dark)}
.draft{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-dark);
  border:1px solid var(--gold-dark);border-radius:2px;padding:1px 5px}
.party{color:var(--muted);font-size:14px;padding:10px 0}

/* coming up */
.soon{padding:40px 0 0}
.soon h2{font-family:var(--display);font-size:22px;letter-spacing:2px;margin-bottom:14px;
  color:rgba(245,242,236,.7)}
.soonrow{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.soonpair{background:var(--card-bg);border:1px solid var(--border);border-radius:4px;padding:16px 18px}
.soonpair .n{font-family:var(--display);font-size:22px;color:var(--gold);letter-spacing:2px}
.soonpair .line{display:flex;gap:10px;font-size:14px;padding:5px 0;align-items:baseline}
.soonpair .line b{font-weight:500;font-size:11px;letter-spacing:1px;text-transform:uppercase;
  color:var(--muted);flex:0 0 34px}
.soonpair .line button{text-align:left;flex:1}
.soonpair .line button:hover{color:var(--gold)}

/* ledger */
.ledger{padding:52px 0 90px}
.ledger h2{font-family:var(--display);font-size:22px;letter-spacing:2px;margin-bottom:4px;
  color:rgba(245,242,236,.7)}
.ledger>p{color:var(--muted);font-size:14px;margin-bottom:18px}
.grid{border-top:1px solid var(--border)}
.ghd,.grow{display:grid;grid-template-columns:52px 1fr 1fr}
.ghd div{font-family:var(--display);letter-spacing:2px;font-size:14px;color:var(--muted);
  padding:10px 14px;border-bottom:1px solid var(--border)}
.grow{border-bottom:1px solid rgba(255,255,255,.05)}
.grow.paired{background:rgba(232,184,75,.045)}
.grow.now{background:rgba(232,184,75,.1)}
.grow .n{font-family:var(--display);font-size:19px;color:var(--muted);padding:12px 14px}
.grow.now .n{color:var(--gold)}
.gcell{text-align:left;padding:12px 14px;width:100%;line-height:1.3}
.gcell:hover{background:rgba(255,255,255,.04)}
.gcell .d{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.gcell .t{display:block;font-size:15px;margin-top:2px}
.gcell.empty{color:var(--muted)}
.pairnote{color:var(--muted);font-size:13px;margin-top:14px}

.mission{margin-top:44px;border:1px solid var(--border);border-left:3px solid var(--gold);
  border-radius:3px;padding:22px 24px;background:var(--card-bg)}
.mission q{font-size:19px;line-height:1.5;quotes:none;display:block}
.mission p{color:var(--muted);font-size:13px;margin-top:10px}

/* doc view */
.docwrap{max-width:74ch;margin:0 auto;padding:34px 0 100px}
.docbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:16px;
  margin-bottom:28px;border-bottom:1px solid var(--border)}
.docbar .crumb{flex:1;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--border);border-radius:3px;padding:7px 14px;font-size:13px;
  background:var(--card-bg)}
.btn:hover{border-color:var(--gold-dark);color:var(--gold)}
.btn.solid{background:var(--gold);color:#0a0a0a;border-color:var(--gold);font-weight:500}
.btn.solid:hover{background:var(--gold-dark);color:#0a0a0a}
.switch{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:26px}
.switch button{border:1px solid var(--border);border-radius:3px;padding:6px 12px;font-size:13px;
  color:var(--muted)}
.switch button.on{background:var(--white);color:#0a0a0a;border-color:var(--white)}

.doc h1{font-family:var(--display);font-size:40px;letter-spacing:1.5px;line-height:1;
  color:var(--gold);margin-bottom:18px}
.doc h2{font-family:var(--display);font-size:26px;letter-spacing:1.5px;margin:38px 0 12px;
  padding-top:18px;border-top:1px solid var(--border)}
.doc h3{font-size:17px;font-weight:700;margin:26px 0 8px;color:var(--gold)}
.doc p{margin-bottom:15px}
.doc ul,.doc ol{margin:0 0 16px 22px}
.doc li{margin-bottom:6px}
.doc hr{border:0;border-top:1px solid var(--border);margin:30px 0}
.doc blockquote{border-left:3px solid var(--gold-dark);background:var(--card-bg);
  padding:14px 18px;margin:18px 0;font-size:17px}
.doc blockquote p:last-child{margin-bottom:0}
.doc table{border-collapse:collapse;width:100%;margin:18px 0;font-size:14px}
.doc th{text-align:left;font-family:var(--display);letter-spacing:1.5px;font-size:14px;
  font-weight:400;color:var(--gold);border-bottom:1px solid var(--gold-dark);padding:8px 10px}
.doc td{border-bottom:1px solid var(--border);padding:8px 10px;vertical-align:top}
.doc strong{font-weight:700}
.doc em{font-style:italic;color:rgba(245,242,236,.8)}
.doc code{background:var(--card-bg);padding:1px 5px;font-size:.92em}

.loading{color:var(--muted);padding:60px 0;text-align:center;font-size:14px}
.err{border:1px solid var(--gold-dark);border-radius:3px;padding:18px 20px;background:var(--card-bg)}
.err h3{color:var(--gold);margin-bottom:6px}

@media (max-width:820px){
  nav{padding:0 1.1rem}
  .pad{padding:0 1.1rem}
  .rooms,.soonrow{grid-template-columns:1fr}
  .ghd{display:none}
  .grow{grid-template-columns:40px 1fr}
  .grow .pairc{grid-column:2;border-top:1px dashed rgba(255,255,255,.07)}
  .mast{padding:36px 0 24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* print — handouts go light on white, always */
@media print{
  nav,.docbar,.switch,.noprint{display:none!important}
  body{background:#fff;color:#000;font-size:11.5pt}
  main{padding:0}
  .docwrap{max-width:none;padding:0}
  .doc h1{color:#000;font-family:'DM Sans',sans-serif;font-size:20pt;font-weight:700;letter-spacing:0}
  .doc h2{color:#000;font-family:'DM Sans',sans-serif;font-size:14pt;font-weight:700;
    letter-spacing:0;border-top:1px solid #bbb;page-break-after:avoid}
  .doc h3{color:#000}
  .doc em{color:#333}
  .doc blockquote{border-left:3px solid #999;background:#f4f4f4}
  .doc th{color:#000;border-bottom:1px solid #000;font-family:'DM Sans',sans-serif;font-weight:700}
  .doc td{border-bottom:1px solid #ccc}
  .doc hr{border-top:1px solid #bbb}
}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="#/">FALL 2026</a>
  <a class="nav-back" href="index.html">The Fellowship</a>
</nav>
<main id="app"><div class="loading">Loading…</div></main>

<script>
(function(){
"use strict";

var BASE = "fall2026/";
var M = null;
var cache = {};

/* ---------------- markdown ---------------- */
function inline(s){
  return s
    .replace(/&(?!nbsp;|amp;|lt;|gt;)/g,"&amp;")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g,"$1<em>$2</em>")
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
}
function mdToHtml(src){
  var lines = src.replace(/\r/g,"").split("\n");
  var out = [], i = 0;
  function flushPara(buf){ if(buf.length) out.push("<p>"+inline(buf.join(" "))+"</p>"); }
  var para = [];
  while(i < lines.length){
    var ln = lines[i];
    // table
    if(/^\s*\|/.test(ln) && i+1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      flushPara(para); para = [];
      var head = ln.split("|").slice(1,-1).map(function(c){return c.trim();});
      i += 2;
      var rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])){
        rows.push(lines[i].split("|").slice(1,-1).map(function(c){return c.trim();}));
        i++;
      }
      var t = "<table><thead><tr>";
      head.forEach(function(h){ t += "<th>"+inline(h)+"</th>"; });
      t += "</tr></thead><tbody>";
      rows.forEach(function(r){
        t += "<tr>";
        r.forEach(function(c){ t += "<td>"+inline(c)+"</td>"; });
        t += "</tr>";
      });
      out.push(t+"</tbody></table>");
      continue;
    }
    var h = /^(#{1,4})\s+(.*)$/.exec(ln);
    if(h){ flushPara(para); para=[];
      var lv = h[1].length; out.push("<h"+lv+">"+inline(h[2])+"</h"+lv+">"); i++; continue; }
    if(/^\s*(---|\*\*\*)\s*$/.test(ln)){ flushPara(para); para=[]; out.push("<hr>"); i++; continue; }
    if(/^>\s?/.test(ln)){
      flushPara(para); para=[];
      var q = [];
      while(i < lines.length && /^>\s?/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/,"")); i++; }
      out.push("<blockquote>"+mdToHtml(q.join("\n"))+"</blockquote>");
      continue;
    }
    if(/^\s*([-*])\s+/.test(ln)){
      flushPara(para); para=[];
      var items = [];
      while(i < lines.length && /^\s*([-*])\s+/.test(lines[i])){
        items.push(lines[i].replace(/^\s*[-*]\s+/,"")); i++;
      }
      out.push("<ul>"+items.map(function(x){return "<li>"+inline(x)+"</li>";}).join("")+"</ul>");
      continue;
    }
    if(/^\s*\d+[.)]\s+/.test(ln)){
      flushPara(para); para=[];
      var oi = [];
      while(i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){
        oi.push(lines[i].replace(/^\s*\d+[.)]\s+/,"")); i++;
      }
      out.push("<ol>"+oi.map(function(x){return "<li>"+inline(x)+"</li>";}).join("")+"</ol>");
      continue;
    }
    if(/^\s*$/.test(ln)){ flushPara(para); para=[]; i++; continue; }
    para.push(ln.trim()); i++;
  }
  flushPara(para);
  return out.join("\n");
}

/* ---------------- data ---------------- */
function getDoc(file){
  if(cache[file]) return Promise.resolve(cache[file]);
  return fetch(BASE+"content/"+file).then(function(r){
    if(!r.ok) throw new Error(r.status+" "+file);
    return r.text();
  }).then(function(t){ cache[file] = t; return t; });
}
function download(file){
  getDoc(file).then(function(text){
    var b = new Blob([text],{type:"text/markdown;charset=utf-8"});
    var u = URL.createObjectURL(b);
    var a = document.createElement("a");
    a.href = u; a.download = file;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(u);},1500);
  });
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function track(k){ return M.tracks.filter(function(t){return t.key===k;})[0]; }
function weekOf(k,n){ return track(k).weeks.filter(function(w){return w.week===n;})[0]; }
function dateObj(w){ return new Date(w.date+" 2026 12:00"); }

function currentWeek(){
  var today = new Date(); today.setHours(0,0,0,0);
  for(var n=1;n<=10;n++){
    var latest = null;
    M.tracks.forEach(function(t){
      var w = weekOf(t.key,n);
      if(w){ var d = dateObj(w); if(!latest || d>latest) latest = d; }
    });
    if(latest && latest >= today) return n;
  }
  return 10;
}

/* ---------------- views ---------------- */
function roleKind(role){
  if(role.indexOf("jh")===0) return "Jr high";
  if(role.indexOf("hs")===0) return "High school";
  return "";
}
function docRows(tk, w){
  if(w.party) return '<p class="party">No study this week.</p>';
  return '<div class="docs">'+w.docs.map(function(d){
    var cls = d.role==="guide" ? "sheet" :
              (d.role.indexOf("handout")>-1 ? "handout" : "sheet");
    return '<button class="docrow '+cls+'" data-open="'+tk+':'+w.week+':'+d.role+'">'+
      '<span class="lbl">'+esc(d.label)+'</span>'+
      (roleKind(d.role) ? '<span class="kind">'+roleKind(d.role)+'</span>' : "")+
      '</button>';
  }).join("")+'</div>';
}

function home(){
  var n = currentWeek();
  var today = new Date(); today.setHours(0,0,0,0);
  var h = '<div class="pad">';
  h += '<header class="mast"><h1>Fall term<br><em>Gather &amp; Grow</em></h1>'+
       '<p>Sunday school and Wednesday night, ten weeks, Sep 13 to Nov 18. '+
       'Teacher guides, leader sheets and every handout, ready to open or print.</p></header>';

  /* this week + next week, both full size */
  function block(num, heading){
    var b = '<section class="now"><div class="now-hd"><h2>'+heading+'</h2>'+
            '<span class="wknum">Week '+num+'</span></div><div class="rooms">';
    M.tracks.forEach(function(t){
      var w = weekOf(t.key,num);
      if(!w) return;
      var past = dateObj(w) < today;
      b += '<article class="room'+(past?" past":"")+'">';
      b += '<span class="kicker">'+esc(t.name)+' · '+esc(t.tag)+'</span>';
      b += '<h3>'+esc(w.title)+(w.written?"":' <span class="draft">Draft</span>')+'</h3>';
      b += '<p class="meta">'+esc(w.date)+(past?" · done":"")+'</p>';
      if(w.source) b += '<p class="src">'+esc(w.source)+'</p>';
      b += docRows(t.key,w);
      b += '</article>';
    });
    return b+'</div></section>';
  }
  h += block(n, "This week");
  if(n < 10) h += block(n+1, "Next week");

  /* coming up */
  var soon = [];
  for(var k=n+2;k<=Math.min(n+4,10);k++) soon.push(k);
  if(soon.length){
    h += '<section class="soon"><h2>Coming up</h2><div class="soonrow">';
    soon.forEach(function(k){
      h += '<div class="soonpair"><span class="n">Week '+k+'</span>';
      M.tracks.forEach(function(t){
        var w = weekOf(t.key,k);
        if(!w) return;
        h += '<div class="line"><b>'+(t.key==="ss"?"Sun":"Wed")+'</b>'+
             '<button data-open="'+t.key+':'+k+':guide">'+esc(w.date)+' — '+esc(w.title)+'</button></div>';
      });
      h += '</div>';
    });
    h += '</div></section>';
  }

  /* ledger */
  h += '<section class="ledger"><h2>All ten weeks</h2>'+
       '<p>Sunday and Wednesday of the same week sit on the same row.</p><div class="grid">';
  h += '<div class="ghd"><div></div><div>Sunday · Gather</div><div>Wednesday · Grow</div></div>';
  for(var i=1;i<=10;i++){
    var paired = M.paired.indexOf(i)>-1;
    h += '<div class="grow'+(paired?" paired":"")+(i===n?" now":"")+'"><div class="n">'+i+'</div>';
    M.tracks.forEach(function(t,idx){
      var w = weekOf(t.key,i);
      var extra = idx===1 ? " pairc" : "";
      if(!w){ h += '<div class="gcell empty'+extra+'">—</div>'; return; }
      h += '<button class="gcell'+extra+'" data-open="'+t.key+':'+i+':guide">'+
           '<span class="d">'+esc(w.date)+'</span><span class="t">'+esc(w.title)+'</span></button>';
    });
    h += '</div>';
  }
  h += '</div><p class="pairnote">Highlighted rows are the deliberate pairings — Sunday teaches the practice, Wednesday teaches the doctrine underneath it.</p>';
  h += '<div class="mission"><q>We gather to faithfully worship God, grow in his grace, and go to the ends of the earth.</q>'+
       '<p>Sundays are Gather. Wednesdays are Grow. Spring is Go.</p></div>';
  h += '</section></div>';
  return h;
}

function docView(tk, wn, role){
  var t = track(tk), w = weekOf(tk, wn);
  var d = w.docs.filter(function(x){return x.role===role;})[0] || w.docs[0];
  var app = document.getElementById("app");
  var h = '<div class="pad"><div class="docwrap">';
  h += '<div class="docbar"><span class="crumb">'+esc(t.name)+' · Week '+wn+'</span>';
  h += '<button class="btn" data-dl="'+d.file+'">Download .md</button>';
  if(d["print"]) h += '<button class="btn solid" id="pr">Print</button>';
  h += '</div>';
  if(w.docs.length>1){
    h += '<div class="switch">'+w.docs.map(function(x){
      return '<button class="'+(x.role===d.role?"on":"")+'" data-open="'+tk+':'+wn+':'+x.role+'">'+
        esc(x.label)+'</button>';
    }).join("")+'</div>';
  }
  h += '<article class="doc" id="body"><div class="loading">Loading…</div></article>';
  h += '</div></div>';
  app.innerHTML = h;
  wire();
  getDoc(d.file).then(function(text){
    document.getElementById("body").innerHTML = mdToHtml(text);
  }).catch(function(e){
    document.getElementById("body").innerHTML =
      '<div class="err"><h3>That file isn\'t there yet</h3><p>Looked for <code>'+
      esc(BASE+"content/"+d.file)+'</code>. If you just added it, check the filename matches manifest.json.</p></div>';
  });
  window.scrollTo(0,0);
}

/* ---------------- routing ---------------- */
function wire(){
  document.querySelectorAll("[data-open]").forEach(function(b){
    b.addEventListener("click", function(){ location.hash = "#/"+b.dataset.open; });
  });
  document.querySelectorAll("[data-dl]").forEach(function(b){
    b.addEventListener("click", function(){ download(b.dataset.dl); });
  });
  var p = document.getElementById("pr");
  if(p) p.addEventListener("click", function(){ window.print(); });
}
function route(){
  var hash = location.hash.replace(/^#\/?/,"");
  if(!hash){ document.getElementById("app").innerHTML = home(); wire(); window.scrollTo(0,0); return; }
  var p = hash.split(":");
  if(p.length===3 && track(p[0]) && weekOf(p[0], +p[1])){ docView(p[0], +p[1], p[2]); return; }
  location.hash = "";
}

fetch(BASE+"manifest.json").then(function(r){
  if(!r.ok) throw new Error(r.status);
  return r.json();
}).then(function(j){
  M = j;
  window.addEventListener("hashchange", route);
  route();
}).catch(function(){
  document.getElementById("app").innerHTML =
    '<div class="pad"><div class="docwrap"><div class="err"><h3>Content didn\'t load</h3>'+
    '<p>This page needs the <code>fall2026/</code> folder sitting next to it, and it has to be '+
    'served over http — opening the file straight off your desktop won\'t work. On GitHub Pages it will.</p>'+
    '</div></div></div>';
});
})();

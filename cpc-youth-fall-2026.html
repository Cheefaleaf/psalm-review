before the split. Every week without exception.</li>\n<li><strong>Split.</strong>\n   - <strong>Jr high</strong> stays: study ~10 min, then games (trivia, Kahoot, prizes) ~30 min.\n   - <strong>High school</strong> walks to Black Rock ~10 min, then small group ~30 min.</li>\n</ol>\n<p>The walk lands inside jr high's study block. Both tracks finish together — one pickup. Closing prayer is inside the small group; high school does not walk back.</p>\n<p>Inside: <strong>Leader Overview</strong>, <strong>Student Overview</strong>, and one page per week with its handout as a child page.</p>", "md": "# Wednesday Night\n\n**Fall · Discipleship (Grow)**\nJr high at church · High school at Black Rock · Sep 16 – Nov 18\n\n1. **Dinner & fellowship — ~30 min.** All groups together.\n2. **Prayer wall — ~10 min.** Everyone, before the split. Every week without exception.\n3. **Split.**\n   - **Jr high** stays: study ~10 min, then games (trivia, Kahoot, prizes) ~30 min.\n   - **High school** walks to Black Rock ~10 min, then small group ~30 min.\n\nThe walk lands inside jr high's study block. Both tracks finish together — one pickup. Closing prayer is inside the small group; high school does not walk back.\n\nInside: **Leader Overview**, **Student Overview**, and one page per week with its handout as a child page.\n", "file": "Wednesday Night.md"}, "d26": {"title": "Wednesday Night — Fall Overview for Leaders", "nav": "Wed Leader Overview", "html": "<h1>Wednesday Night — Fall Overview for Leaders</h1>\n<p><strong>Fall · Discipleship (Grow)</strong>\nJr high at church · High school at Black Rock · Sep 16 – Nov 18</p>\n<hr />\n<h2>Journey pages for the term</h2>\n<p>Curriculum is <strong>The Journey</strong> (Life on Life Ministries). On Wednesday the Journey pages <em>are</em> the leader guide — work them close to as printed. Pages will be sent to leaders in advance each week, along with condensed teacher study material.</p>\n<table>\n<thead>\n<tr>\n<th>Wk</th>\n<th>Date</th>\n<th>Topic</th>\n<th>Journey source</th>\n<th>Pages</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Sep 16</td>\n<td>Kickoff party — no study</td>\n<td>—</td>\n<td>—</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Sep 23</td>\n<td>Grace — the performance trap</td>\n<td>Blue · Gospel Living U3</td>\n<td>45–56</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Sep 30</td>\n<td>Faith — Do or Done</td>\n<td>Blue · Gospel Living U4</td>\n<td>57–68</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Oct 7</td>\n<td>Reading &amp; prayer — PRAISE + Five Targets</td>\n<td>Blue · Gospel Living U5–6 + Appendix A</td>\n<td>69–91</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Oct 14</td>\n<td>Justification &amp; Adoption</td>\n<td>Red · Biblical Worldview U1</td>\n<td>245</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Oct 21</td>\n<td>Assurance of Salvation</td>\n<td>Red · Biblical Worldview U2</td>\n<td>261</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Oct 28</td>\n<td>Sanctification <em>(alt: Why are we Presbyterian?)</em></td>\n<td>Red · Biblical Worldview U3</td>\n<td>275</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Nov 4</td>\n<td>The Spirit <em>(alt: Charismatic friends — gifts &amp; cessationism)</em></td>\n<td>Green · Knowing God U3</td>\n<td>167</td>\n</tr>\n<tr>\n<td>9</td>\n<td>Nov 11</td>\n<td>God's Forgiveness <em>(alt: Catholic friends)</em></td>\n<td>Red · Knowing God U3</td>\n<td>175</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Nov 18</td>\n<td>Party — no study</td>\n<td>—</td>\n<td>—</td>\n</tr>\n</tbody>\n</table>\n<p>Sunday week 1 teaches Glory (Blue U1) — Wednesday picks up at Grace, so the two tracks run the Gospel Living section in sequence.</p>\n<p>Weeks 5, 6 and 8 land the same week Sunday covers baptism, the Table, and spiritual gifts.</p>\n<p><strong>Weeks 7–9 alternates</strong> are original content, not Journey. If written by late October, swap them in. Each Journey unit listed feeds its alternate.</p>\n<p><strong>Skip all unit assignments</strong> — readings, audio, assessments. No homework. The weekly \"one practice\" replaces them.</p>\n<hr />\n<h2>The night</h2>\n<ol>\n<li><strong>Dinner &amp; fellowship — ~30 min.</strong> All three groups together.</li>\n<li><strong>Prayer wall — ~10 min.</strong> Everyone, before the split. Every week without exception.</li>\n<li><strong>Split.</strong>\n   - <strong>Jr high</strong> stays: study ~10 min, then games (trivia, Kahoot, prizes) ~30 min.\n   - <strong>High school</strong> walks to Black Rock ~10 min, then small group ~30 min.</li>\n</ol>\n<p>The walk lands inside jr high's study block. Both tracks finish together — one pickup.</p>\n<p><strong>Closing prayer is inside the small group.</strong> High school does not walk back.</p>\n<hr />\n<h2>The two cuts</h2>\n<p>Same topic, same Journey unit, two depths.</p>\n<p><strong>High school — ~30 min at Black Rock.</strong> Work the unit close to as printed:\n- Opener: last week's one practice — what'd you notice? (~5)\n- The unit's core idea, briefly (~5)\n- Equipping passages and questions from the handout (~15)\n- Mission — one name each (~2)\n- Pray for each other by name (~3)\n- Assign this week's one practice before they leave</p>\n<p><strong>Jr high — ~10 min at church.</strong> One passage, one question, then games. Don't compress the high school session; pick the single thing that matters.</p>\n<hr />\n<h2>The weekly rhythm</h2>\n<p>Every high school session ends with <strong>one practice</strong> for the week — nothing on paper, nothing to lose. The next session opens by asking what they noticed. That opener is what makes this discipleship rather than a talk.</p>\n<p>Week 4 installs the two tools from Appendix A — <strong>PRAISE</strong> (Pray first · Read · Ask · Interpret · Summarize · Engage) and the <strong>Five Targets of Prayer</strong>. From then on, the one practice usually uses one of them.</p>\n<hr />\n<h2>Staffing</h2>\n<ul>\n<li><strong>Dinner and prayer wall:</strong> all leaders present. One facilitates the wall.</li>\n<li><strong>Jr high after the split:</strong> one adult for the study, one or two for games.</li>\n<li><strong>High school after the split:</strong> one adult walks them over. At Black Rock, <strong>one leader per five students.</strong> Six or more, split boy/girl. Five or fewer, stay whole.</li>\n<li><strong>Peak need is the small-group block: three to four adults at once.</strong> This is where a missing leader is felt. Young-adult facilitators fill this slot.</li>\n</ul>\n<hr />\n<h2>Handout</h2>\n<p>Each week's teaching doc includes a one-page student handout with the Equipping passages and three or four questions. High school uses it as the discussion guide at Black Rock. Jr high uses one question from it.</p>\n<hr />\n<h2>9th graders</h2>\n<p>Weekly choice: jr high or Black Rock. Their call, every week.</p>\n<hr />\n<h2>Materials each week</h2>\n<ul>\n<li>Journey pages (sent in advance)</li>\n<li>Condensed teacher study material (sent in advance)</li>\n<li>Student handout, printed</li>\n<li>Bibles (ESV)</li>\n<li>Prayer wall supplies</li>\n<li>Games and prizes for jr high</li>\n</ul>", "md": "# Wednesday Night — Fall Overview for Leaders\n\n**Fall · Discipleship (Grow)**\nJr high at church · High school at Black Rock · Sep 16 – Nov 18\n\n---\n\n## Journey pages for the term\n\nCurriculum is **The Journey** (Life on Life Ministries). On Wednesday the Journey pages *are* the leader guide — work them close to as printed. Pages will be sent to leaders in advance each week, along with condensed teacher study material.\n\n| Wk | Date | Topic | Journey source | Pages |\n|---|---|---|---|---|\n| 1 | Sep 16 | Kickoff party — no study | — | — |\n| 2 | Sep 23 | Grace — the performance trap | Blue · Gospel Living U3 | 45–56 |\n| 3 | Sep 30 | Faith — Do or Done | Blue · Gospel Living U4 | 57–68 |\n| 4 | Oct 7 | Reading & prayer — PRAISE + Five Targets | Blue · Gospel Living U5–6 + Appendix A | 69–91 |\n| 5 | Oct 14 | Justification & Adoption | Red · Biblical Worldview U1 | 245 |\n| 6 | Oct 21 | Assurance of Salvation | Red · Biblical Worldview U2 | 261 |\n| 7 | Oct 28 | Sanctification *(alt: Why are we Presbyterian?)* | Red · Biblical Worldview U3 | 275 |\n| 8 | Nov 4 | The Spirit *(alt: Charismatic friends — gifts & cessationism)* | Green · Knowing God U3 | 167 |\n| 9 | Nov 11 | God's Forgiveness *(alt: Catholic friends)* | Red · Knowing God U3 | 175 |\n| 10 | Nov 18 | Party — no study | — | — |\n\nSunday week 1 teaches Glory (Blue U1) — Wednesday picks up at Grace, so the two tracks run the Gospel Living section in sequence.\n\nWeeks 5, 6 and 8 land the same week Sunday covers baptism, the Table, and spiritual gifts.\n\n**Weeks 7–9 alternates** are original content, not Journey. If written by late October, swap them in. Each Journey unit listed feeds its alternate.\n\n**Skip all unit assignments** — readings, audio, assessments. No homework. The weekly \"one practice\" replaces them.\n\n---\n\n## The night\n\n1. **Dinner & fellowship — ~30 min.** All three groups together.\n2. **Prayer wall — ~10 min.** Everyone, before the split. Every week without exception.\n3. **Split.**\n   - **Jr high** stays: study ~10 min, then games (trivia, Kahoot, prizes) ~30 min.\n   - **High school** walks to Black Rock ~10 min, then small group ~30 min.\n\nThe walk lands inside jr high's study block. Both tracks finish together — one pickup.\n\n**Closing prayer is inside the small group.** High school does not walk back.\n\n---\n\n## The two cuts\n\nSame topic, same Journey unit, two depths.\n\n**High school — ~30 min at Black Rock.** Work the unit close to as printed:\n- Opener: last week's one practice — what'd you notice? (~5)\n- The unit's core idea, briefly (~5)\n- Equipping passages and questions from the handout (~15)\n- Mission — one name each (~2)\n- Pray for each other by name (~3)\n- Assign this week's one practice before they leave\n\n**Jr high — ~10 min at church.** One passage, one question, then games. Don't compress the high school session; pick the single thing that matters.\n\n---\n\n## The weekly rhythm\n\nEvery high school session ends with **one practice** for the week — nothing on paper, nothing to lose. The next session opens by asking what they noticed. That opener is what makes this discipleship rather than a talk.\n\nWeek 4 installs the two tools from Appendix A — **PRAISE** (Pray first · Read · Ask · Interpret · Summarize · Engage) and the **Five Targets of Prayer**. From then on, the one practice usually uses one of them.\n\n---\n\n## Staffing\n\n- **Dinner and prayer wall:** all leaders present. One facilitates the wall.\n- **Jr high after the split:** one adult for the study, one or two for games.\n- **High school after the split:** one adult walks them over. At Black Rock, **one leader per five students.** Six or more, split boy/girl. Five or fewer, stay whole.\n- **Peak need is the small-group block: three to four adults at once.** This is where a missing leader is felt. Young-adult facilitators fill this slot.\n\n---\n\n## Handout\n\nEach week's teaching doc includes a one-page student handout with the Equipping passages and three or four questions. High school uses it as the discussion guide at Black Rock. Jr high uses one question from it.\n\n---\n\n## 9th graders\n\nWeekly choice: jr high or Black Rock. Their call, every week.\n\n---\n\n## Materials each week\n\n- Journey pages (sent in advance)\n- Condensed teacher study material (sent in advance)\n- Student handout, printed\n- Bibles (ESV)\n- Prayer wall supplies\n- Games and prizes for jr high\n", "file": "Wed Leader Overview.md"}, "d27": {"title": "Wednesday Nights This Fall", "nav": "Wed Student Overview", "html": "<h1>Wednesday Nights This Fall</h1>\n<p><strong>Grow</strong>\nWednesdays · Sep 16 – Nov 18</p>\n<hr />\n<h2>What this is</h2>\n<p>Wednesdays are smaller, deeper, and more honest than Sunday. We eat together, pray together, then split up. Jr high stays for a quick study and games. High school walks to Black Rock for a real conversation — five or six of you and a leader, thirty minutes, no lecture.</p>\n<p>We're using <strong>The Journey</strong>. No homework. Everything happens in the room. The only thing you take with you each week is one thing to notice — and we'll ask you about it next time.</p>\n<hr />\n<h2>How the night runs</h2>\n<ul>\n<li><strong>Dinner</strong> — everyone, all three groups.</li>\n<li><strong>Prayer wall</strong> — everyone, every week. Same wall as Sunday.</li>\n<li><strong>Split</strong></li>\n<li><em>Jr high</em> — ten minutes on one question, then trivia, Kahoot, prizes.</li>\n<li><em>High school</em> — walk to Black Rock, grab a drink, thirty minutes of actual conversation. We pray for each other before we leave.</li>\n</ul>\n<p>Both groups finish at the same time.</p>\n<p><strong>9th graders:</strong> you choose every week — jr high or Black Rock. Nobody's locking you in.</p>\n<hr />\n<h2>Where we're going</h2>\n<table>\n<thead>\n<tr>\n<th>Date</th>\n<th>What we're looking at</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Sep 16</td>\n<td>Kickoff — no study, just food and hanging out</td>\n</tr>\n<tr>\n<td>Sep 23</td>\n<td>Grace — are you trying to earn it?</td>\n</tr>\n<tr>\n<td>Sep 30</td>\n<td>Faith — Do, or Done?</td>\n</tr>\n<tr>\n<td>Oct 7</td>\n<td>How to actually read the Bible and pray</td>\n</tr>\n<tr>\n<td>Oct 14</td>\n<td>What happened to you when you believed</td>\n</tr>\n<tr>\n<td>Oct 21</td>\n<td>How do you know you're really a Christian?</td>\n</tr>\n<tr>\n<td>Oct 28</td>\n<td>Why growing is slow</td>\n</tr>\n<tr>\n<td>Nov 4</td>\n<td>The Holy Spirit</td>\n</tr>\n<tr>\n<td>Nov 11</td>\n<td>Forgiveness</td>\n</tr>\n<tr>\n<td>Nov 18</td>\n<td>Party</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>Why \"Grow\"</h2>\n<p>Our church's mission is to <strong>worship God faithfully, grow in the grace of the gospel, and send disciples into the world.</strong> Gather, Grow, Go. Sundays are Gather. Wednesdays are Grow. Spring is Go.</p>", "md": "# Wednesday Nights This Fall\n\n**Grow**\nWednesdays · Sep 16 – Nov 18\n\n---\n\n## What this is\n\nWednesdays are smaller, deeper, and more honest than Sunday. We eat together, pray together, then split up. Jr high stays for a quick study and games. High school walks to Black Rock for a real conversation — five or six of you and a leader, thirty minutes, no lecture.\n\nWe're using **The Journey**. No homework. Everything happens in the room. The only thing you take with you each week is one thing to notice — and we'll ask you about it next time.\n\n---\n\n## How the night runs\n\n- **Dinner** — everyone, all three groups.\n- **Prayer wall** — everyone, every week. Same wall as Sunday.\n- **Split**\n  - *Jr high* — ten minutes on one question, then trivia, Kahoot, prizes.\n  - *High school* — walk to Black Rock, grab a drink, thirty minutes of actual conversation. We pray for each other before we leave.\n\nBoth groups finish at the same time.\n\n**9th graders:** you choose every week — jr high or Black Rock. Nobody's locking you in.\n\n---\n\n## Where we're going\n\n| Date | What we're looking at |\n|---|---|\n| Sep 16 | Kickoff — no study, just food and hanging out |\n| Sep 23 | Grace — are you trying to earn it? |\n| Sep 30 | Faith — Do, or Done? |\n| Oct 7 | How to actually read the Bible and pray |\n| Oct 14 | What happened to you when you believed |\n| Oct 21 | How do you know you're really a Christian? |\n| Oct 28 | Why growing is slow |\n| Nov 4 | The Holy Spirit |\n| Nov 11 | Forgiveness |\n| Nov 18 | Party |\n\n---\n\n## Why \"Grow\"\n\nOur church's mission is to **worship God faithfully, grow in the grace of the gospel, and send disciples into the world.** Gather, Grow, Go. Sundays are Gather. Wednesdays are Grow. Spring is Go.\n", "file": "Wed Student Overview.md"}, "d28": {"title": "Wednesday · Week 1 — Kickoff Party", "nav": "Wed Week 1 - Kickoff Party", "html": "<h1>Wednesday · Week 1 — Kickoff Party</h1>\n<p><strong>Sep 16</strong></p>\n<p>No study. Launch night.</p>\n<ul>\n<li><strong>Dinner</strong> — all groups together, longer than usual.</li>\n<li><strong>Prayer wall</strong> — first use on Wednesday. Explain it once, then do it. Say plainly: every week, both days, never skipped.</li>\n<li><strong>Games</strong> — whole group, jr high and high school together.</li>\n<li>No split, no walk to Black Rock. First study is Sep 23 (Grace).</li>\n</ul>\n<p>Worth saying out loud before the night ends: what Wednesdays are for, that high school walks to Black Rock starting next week, and that 9th graders choose their room each week.</p>", "md": "# Wednesday · Week 1 — Kickoff Party\n\n**Sep 16**\n\nNo study. Launch night.\n\n- **Dinner** — all groups together, longer than usual.\n- **Prayer wall** — first use on Wednesday. Explain it once, then do it. Say plainly: every week, both days, never skipped.\n- **Games** — whole group, jr high and high school together.\n- No split, no walk to Black Rock. First study is Sep 23 (Grace).\n\nWorth saying out loud before the night ends: what Wednesdays are for, that high school walks to Black Rock starting next week, and that 9th graders choose their room each week.\n", "file": "Wed Week 1 - Kickoff Party.md"}, "d29": {"title": "Wednesday · Week 2 — Grace", "nav": "Wed Week 2 - Grace", "html": "<h1>Wednesday · Week 2 — Grace</h1>\n<p><strong>Sep 23 · First study of the term</strong></p>\n<p><strong>Journey:</strong> Blue Year, Gospel Living Unit 3, \"Grace — Why We Embrace the Cross,\" pp. 45–56\n<strong>Memory verse:</strong> 2 Corinthians 5:21\n<strong>In Bible:</strong> Galatians 5:1–8 · Ephesians 2:1–13 · Colossians 2:13–23</p>\n<p><em>Faith is next week (Unit 4). This week stays on performance vs. grace and the great swap. Hold Paul/James and the three beliefs for week 3.</em></p>\n<hr />\n<h2>Big idea</h2>\n<p>There are only two ways to relate to God, and every religion picks one. <strong>Performance</strong> — what I do for God. <strong>Grace</strong> — what God has done for me. Performance feels natural and produces self-righteousness. Grace is the cross: God swapped our sin for Christ's righteousness. Sunday named the counterfeits we chase. Tonight names the deeper trap — chasing God's approval the same way.</p>\n<hr />\n<h2>Condensed teacher study material</h2>\n<p><em>From Journey pp. 46–50. Read the full pages; this is the spine.</em></p>\n<p><strong>Two ways to relate to God (p. 48).</strong> Everyone who believes in God wants to be rightly related to Him — assured of His goodness now and when they die. There are two ways, and every religion follows one:</p>\n<p><strong>1 · Performance — what I do for God.</strong> Doing things (or not doing things) to gain God's approval. The determination it takes produces a real kind of goodness Journey calls <strong>self-righteousness.</strong> We say we hate self-righteousness, but what we actually hate is the arrogant kind — the Pharisee. Regular, humble self-righteous people we like fine. They make good neighbors.</p>\n<p><strong>Jesus was repulsed by all of it (p. 48)</strong> because He cares about motive. Journey's picture: a husband who's decided to break a date with his wife for selfish reasons, and tries to buy her off first with gifts. She's flattered until she learns the motive — then she's repulsed. Same with God: He loves church, giving, serving — but only when they come from love for Him, not from trying to get Him to like us. <strong>Performance is giving God the things He loves with the wrong motive.</strong></p>\n<p><strong>2 · Grace — what God has done for me (p. 49).</strong> The cross. Memory verse: God made Christ to be sin so that in Him we might become the righteousness of God. Journey calls it <strong>the great swap</strong> — our sinfulness exchanged for Christ's righteousness. This is <strong>declared righteousness</strong>: God declares a person righteous the moment the swap happens.</p>\n<p><strong>Justification (p. 49)</strong> — <em>just-as-if-I'd-never-sinned.</em> Doesn't mean sinless. Means God pardons the penalty for all our sin. Colossians 2:13–14: the record of debt cancelled, nailed to the cross. We can still offend Him and need to confess to recover joy — but nothing alters His love, because our standing rests entirely on what Christ did.</p>\n<p><strong>Does grace mean live however you want? (p. 49)</strong> No and yes. No — a prayer doesn't cause the swap; like a wedding vow, it expresses a love that already exists. Yes — believers are free from sin's debt and now have the moral ability to do good <em>out of love</em> rather than to earn anything. (That newborn love is faith — next week.)</p>\n<p><strong>The struggle is normal (p. 50).</strong> Even born-again Christians default to performance. Journey's diagnostic questions: Do you look at past failures and wonder if they affect God's love? Do you go to church, give, or read your Bible because you're worried God's favor slips if you don't?</p>\n<hr />\n<h2>High school — ~30 min at Black Rock</h2>\n<p><strong>Opener — 5 min.</strong> First real week, so no prior practice to check. Instead: <em>\"Sunday we named the counterfeits — praise, power, pleasure. Did you catch yourself chasing one this week?\"</em> Quick, honest, then move.</p>\n<p><strong>The idea — 5 min.</strong> Two ways to relate to God. Draw it if there's a napkin: <strong>What I do for God</strong> → self-righteousness. <strong>What God has done for me</strong> → grace. Every religion picks one. Which one feels more natural? (Performance. Always.)</p>\n<p><strong>Equipping — 15 min.</strong> Handout. Read Ephesians 2:1–13 together, then work the questions. Let 3 and 4 take most of the time.</p>\n<p><strong>Mission — 2 min.</strong> One name each. Someone you know who's exhausting themselves trying to be good enough.</p>\n<p><strong>Supplication — 3 min.</strong> Pray for each other by name. Pray for the names.</p>\n<p><strong>One practice for the week.</strong> <em>Notice when you do something for God to get Him to like you — church, being nice, reading your Bible, not doing something. Just catch the motive in the moment. Next week's opener: what'd you notice?</em></p>\n<hr />\n<h2>Jr high — ~10 min at church</h2>\n<p>Read Ephesians 2:8–9 aloud. One question:</p>\n<p><em>\"If you had to convince God to like you, what would you do? Now — what does this verse say about that?\"</em></p>\n<p>Let three or four answer. Land the one sentence: <strong>you can't earn it, and you don't have to.</strong> Then games.</p>\n<hr />\n<h2>Watch-outs</h2>\n<ul>\n<li>Kids will hear \"grace\" as a church word and nod. Force the contrast: <em>what I do</em> vs. <em>what He did.</em> Make them say which one they actually run on.</li>\n<li>The husband-and-wife picture lands hard with teenagers. Use it.</li>\n<li>Don't rush to \"faith\" — it's next week. If someone asks \"so what do I do?\", the answer this week is <em>nothing — that's the point.</em> Let it sit.</li>\n<li>Group of six or more: split boy/girl at Black Rock. Five or fewer: stay together.</li>\n</ul>", "md": "# Wednesday · Week 2 — Grace\n\n**Sep 23 · First study of the term**\n\n**Journey:** Blue Year, Gospel Living Unit 3, \"Grace — Why We Embrace the Cross,\" pp. 45–56\n**Memory verse:** 2 Corinthians 5:21\n**In Bible:** Galatians 5:1–8 · Ephesians 2:1–13 · Colossians 2:13–23\n\n*Faith is next week (Unit 4). This week stays on performance vs. grace and the great swap. Hold Paul/James and the three beliefs for week 3.*\n\n---\n\n## Big idea\n\nThere are only two ways to relate to God, and every religion picks one. **Performance** — what I do for God. **Grace** — what God has done for me. Performance feels natural and produces self-righteousness. Grace is the cross: God swapped our sin for Christ's righteousness. Sunday named the counterfeits we chase. Tonight names the deeper trap — chasing God's approval the same way.\n\n---\n\n## Condensed teacher study material\n\n*From Journey pp. 46–50. Read the full pages; this is the spine.*\n\n**Two ways to relate to God (p. 48).** Everyone who believes in God wants to be rightly related to Him — assured of His goodness now and when they die. There are two ways, and every religion follows one:\n\n**1 · Performance — what I do for God.** Doing things (or not doing things) to gain God's approval. The determination it takes produces a real kind of goodness Journey calls **self-righteousness.** We say we hate self-righteousness, but what we actually hate is the arrogant kind — the Pharisee. Regular, humble self-righteous people we like fine. They make good neighbors.\n\n**Jesus was repulsed by all of it (p. 48)** because He cares about motive. Journey's picture: a husband who's decided to break a date with his wife for selfish reasons, and tries to buy her off first with gifts. She's flattered until she learns the motive — then she's repulsed. Same with God: He loves church, giving, serving — but only when they come from love for Him, not from trying to get Him to like us. **Performance is giving God the things He loves with the wrong motive.**\n\n**2 · Grace — what God has done for me (p. 49).** The cross. Memory verse: God made Christ to be sin so that in Him we might become the righteousness of God. Journey calls it **the great swap** — our sinfulness exchanged for Christ's righteousness. This is **declared righteousness**: God declares a person righteous the moment the swap happens.\n\n**Justification (p. 49)** — *just-as-if-I'd-never-sinned.* Doesn't mean sinless. Means God pardons the penalty for all our sin. Colossians 2:13–14: the record of debt cancelled, nailed to the cross. We can still offend Him and need to confess to recover joy — but nothing alters His love, because our standing rests entirely on what Christ did.\n\n**Does grace mean live however you want? (p. 49)** No and yes. No — a prayer doesn't cause the swap; like a wedding vow, it expresses a love that already exists. Yes — believers are free from sin's debt and now have the moral ability to do good *out of love* rather than to earn anything. (That newborn love is faith — next week.)\n\n**The struggle is normal (p. 50).** Even born-again Christians default to performance. Journey's diagnostic questions: Do you look at past failures and wonder if they affect God's love? Do you go to church, give, or read your Bible because you're worried God's favor slips if you don't?\n\n---\n\n## High school — ~30 min at Black Rock\n\n**Opener — 5 min.** First real week, so no prior practice to check. Instead: *\"Sunday we named the counterfeits — praise, power, pleasure. Did you catch yourself chasing one this week?\"* Quick, honest, then move.\n\n**The idea — 5 min.** Two ways to relate to God. Draw it if there's a napkin: **What I do for God** → self-righteousness. **What God has done for me** → grace. Every religion picks one. Which one feels more natural? (Performance. Always.)\n\n**Equipping — 15 min.** Handout. Read Ephesians 2:1–13 together, then work the questions. Let 3 and 4 take most of the time.\n\n**Mission — 2 min.** One name each. Someone you know who's exhausting themselves trying to be good enough.\n\n**Supplication — 3 min.** Pray for each other by name. Pray for the names.\n\n**One practice for the week.** *Notice when you do something for God to get Him to like you — church, being nice, reading your Bible, not doing something. Just catch the motive in the moment. Next week's opener: what'd you notice?*\n\n---\n\n## Jr high — ~10 min at church\n\nRead Ephesians 2:8–9 aloud. One question:\n\n*\"If you had to convince God to like you, what would you do? Now — what does this verse say about that?\"*\n\nLet three or four answer. Land the one sentence: **you can't earn it, and you don't have to.** Then games.\n\n---\n\n## Watch-outs\n\n- Kids will hear \"grace\" as a church word and nod. Force the contrast: *what I do* vs. *what He did.* Make them say which one they actually run on.\n- The husband-and-wife picture lands hard with teenagers. Use it.\n- Don't rush to \"faith\" — it's next week. If someone asks \"so what do I do?\", the answer this week is *nothing — that's the point.* Let it sit.\n- Group of six or more: split boy/girl at Black Rock. Five or fewer: stay together.\n", "file": "Wed Week 2 - Grace.md"}, "d30": {"title": "Student Handout · Week 2 — Grace", "nav": "Wed Week 2 Handout - Grace", "html": "<h1>Student Handout · Week 2 — Grace</h1>\n<p><strong>Sep 23</strong> · Read Ephesians 2:1–13 · Work these on your own first, then we talk.</p>\n<p><strong>Memory verse:</strong> <em>\"For our sake he made him to be sin who knew no sin, so that in him we might become the righteousness of God.\"</em> — 2 Corinthians 5:21</p>\n<p><strong>1.</strong> Verses 1–3 describe where everyone starts. Put it in your own words. Is Paul exaggerating?</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>2.</strong> Verses 4–9. What did God do? Circle every verb that has God as the subject.</p>\n<p>&nbsp;</p>\n<p><strong>3.</strong> Two ways to relate to God: <strong>what I do for Him</strong> or <strong>what He's done for me.</strong> Which one do you actually run on most days? What's the evidence?</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>4.</strong> Do you ever go to church, read your Bible, or try to be good because you're worried God's opinion of you slips if you don't? What's that about?</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>5.</strong> Journey calls justification <em>just-as-if-I'd-never-sinned.</em> If that's true of you, what changes? If you're not sure it's true of you, what would you need to know?</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>", "md": "# Student Handout · Week 2 — Grace\n\n**Sep 23** · Read Ephesians 2:1–13 · Work these on your own first, then we talk.\n\n**Memory verse:** *\"For our sake he made him to be sin who knew no sin, so that in him we might become the righteousness of God.\"* — 2 Corinthians 5:21\n\n**1.** Verses 1–3 describe where everyone starts. Put it in your own words. Is Paul exaggerating?\n\n&nbsp;\n\n&nbsp;\n\n**2.** Verses 4–9. What did God do? Circle every verb that has God as the subject.\n\n&nbsp;\n\n**3.** Two ways to relate to God: **what I do for Him** or **what He's done for me.** Which one do you actually run on most days? What's the evidence?\n\n&nbsp;\n\n&nbsp;\n\n**4.** Do you ever go to church, read your Bible, or try to be good because you're worried God's opinion of you slips if you don't? What's that about?\n\n&nbsp;\n\n&nbsp;\n\n**5.** Journey calls justification *just-as-if-I'd-never-sinned.* If that's true of you, what changes? If you're not sure it's true of you, what would you need to know?\n\n&nbsp;\n\n&nbsp;\n", "file": "Wed Week 2 Handout - Grace.md"}, "d31": {"title": "Wednesday · Week 3 — Faith", "nav": "Wed Week 3 - Faith", "html": "<h1>Wednesday · Week 3 — Faith</h1>\n<p><strong>Sep 30</strong></p>\n<p><strong>Journey:</strong> Blue Year · Gospel Living U4, \"Faith — Do or Done\", pp. 57–68\n<strong>Memory verse:</strong> <em>to add</em>\n<strong>In Bible:</strong> <em>to add</em></p>\n<blockquote>\n<p><strong>Not yet written.</strong> Structure below matches Week 2 — fill each section from the Journey unit.</p>\n</blockquote>\n<hr />\n<h2>Big idea</h2>\n<p><em>One paragraph.</em></p>\n<hr />\n<h2>Condensed teacher study material</h2>\n<p><em>From the Journey pages above. The spine, not the whole unit.</em></p>\n<hr />\n<h2>High school — ~30 min at Black Rock</h2>\n<p><strong>Opener — 5 min.</strong> Last week's one practice — what'd you notice?</p>\n<p><strong>The idea — 5 min.</strong></p>\n<p><strong>Equipping — 15 min.</strong> Handout questions.</p>\n<p><strong>Mission — 2 min.</strong> One name each.</p>\n<p><strong>Supplication — 3 min.</strong> Pray for each other by name.</p>\n<p><strong>One practice for the week.</strong> <em>to add</em></p>\n<hr />\n<h2>Jr high — ~10 min at church</h2>\n<p>One passage, one question, then games.</p>\n<hr />\n<h2>Watch-outs</h2>\n<p><em>to add</em></p>", "md": "# Wednesday · Week 3 — Faith\n\n**Sep 30**\n\n**Journey:** Blue   return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}

function download(id){
  var d = DOCS[id];
  var blob = new Blob([d.md], {type:"text/markdown;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = d.file;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);}, 1500);
}

}

    h += "</div>";
  });
  navEl.innerHTML = h;
  navEl.querySelectorAll(".navlink").forEach(function(b){
    b.addEventListener("click", function(){ go(b.dataset.page); });
  });
}
function navBtn(page,label,cls){
  return '<button class="navlink '+(cls||"")+'" data-page="'+page+'">'+label+'</button>';
}
function isWritten(track, wk){
  return NAV.written.some(function(p){ return p[0]===track && p[1]===wk; });
}
function markNav(){
  navEl.querySelectorAll(".navlink").forEach(function(b){
    b.classList.toggle("on", b.dataset.page===state.page);
  });
}

/* ---------------- views ---------------- */
function ledger(){
  var ss = NAV.tracks[0], wed = NAV.tracks[1];
  var h = '<div class="ledger"><div class="ledger-head">';
  h += '<h2>Ten weeks, two tracks</h2>';
  h += '<p>Sunday and Wednesday of the same week sit on the same row. Pick any cell to open that week.</p>';
  h += '</div><div class="grid">';
  h += '<div class="grid-hd"><div></div><div class="h-ss">Sunday · Gather</div><div class="h-wed">Wednesday · Grow</div></div>';
  for(var i=0;i<10;i++){
    var paired = NAV.paired.indexOf(i+1) > -1;
    h += '<div class="wkrow'+(paired?" paired":"")+'">';
    h += '<div class="wkn">'+(i+1)+'</div>';
    h += cell(ss, i, "ss", "");
    h += cell(wed, i, "wed", "pair");
    h += '</div>';
  }
  h += '</div>';
  h += '<p class="pairnote"><i></i><span>Shaded rows are the deliberate pairings — Sunday teaches the practice, Wednesday teaches the doctrine underneath it.</span></p>';
  h += '<div class="mission"><blockquote>We gather to faithfully worship God, grow in his grace, and go to the ends of the earth.</blockquote>';
  h += '<p>Sundays are Gather. Wednesdays are Grow. Spring is Go.</p></div>';
  h += '</div>';
  return h;
}
function cell(track, i, key, extra){
  var w = track.weeks[i];
  var date = track.dates[i];
  if(!w) return '<div class="cell none '+extra+'"><span class="d">'+date+'</span><span class="t">—</span></div>';
  return '<button class="cell '+key+' '+extra+'" data-page="'+key+':w'+w.week+'">'+
    '<span class="d">'+date+'</span><span class="t">'+esc(w.short)+'</span></button>';
}

function resolve(page){
  if(page==="home") return {id:NAV.home};
  if(page==="schedule") return {id:NAV.schedule};
  var p = page.split(":"), t = p[0]==="ss"?NAV.tracks[0]:NAV.tracks[1], k = p[1];
  if(k==="section") return {id:t.section, track:t};
  if(k==="leader") return {id:t.leader, track:t};
  if(k==="student") return {id:t.student, track:t};
  if(k==="extra0") return {id:t.extra[0].id, track:t};
  if(k.charAt(0)==="w"){
    var n = parseInt(k.slice(1),10);
    var w = t.weeks.filter(function(x){return x.week===n;})[0];
    return {id:w.guide, handout:w.handout, track:t, week:w};
  }
  return {id:NAV.home};
}

function docView(page){
  var r = resolve(page);
  var showHandout = state.tab==="handout" && r.handout;
  var id = showHandout ? r.handout : r.id;
  var d = DOCS[id];
  var h = '<div class="wrap">';
  h += '<div class="docbar noprint">';
  h += '<span class="crumb">'+(r.track ? esc(r.track.name) : "Fall 2026")+'</span>';
  if(r.handout){
    h += '<div class="tabs">';
    h += '<button class="tab '+(showHandout?"":"on")+'" data-tab="guide">Teacher guide</button>';
    h += '<button class="tab '+(showHandout?"on":"")+'" data-tab="handout">Handout</button>';
    h += '</div>';
  }
  h += '<button class="dl" data-dl="'+id+'">Download .md</button>';
  if(showHandout) h += '<button class="dl solid" id="printbtn">Print handout</button>';
  h += '</div>';
  h += '<article class="doc">'+d.html+'</article></div>';
  return h;
}

function filesView(){
  var h = '<div class="filelist"><h2>All files</h2>';
  h += '<p>Every document in the term, as markdown. Downloads open in whatever you use for text — or drop them straight into Notion, Docs, or Word.</p>';
  var groups = [
    ["Term", [NAV.home, NAV.schedule]],
    ["Sunday School", trackIds(NAV.tracks[0])],
    ["Wednesday Night", trackIds(NAV.tracks[1])]
  ];
  groups.forEach(function(g){
    h += '<h3 style="font-family:var(--sans);font-size:13px;margin:28px 0 6px">'+g[0]+'</h3>';
    g[1].forEach(function(id){
      if(!id) return;
      h += '<div class="frow"><span class="fn">'+esc(DOCS[id].title)+'</span>'+
           '<button class="dl" data-dl="'+id+'">Download</button></div>';
    });
  });
  h += '</div>';
  return h;
}
function trackIds(t){
  var ids = [t.section, t.leader, t.student];
  t.extra.forEach(function(x){ ids.push(x.id); });
  t.weeks.forEach(function(w){ ids.push(w.guide); if(w.handout) ids.push(w.handout); });
  return ids;
}

/* ---------------- routing ---------------- */
function go(page, keepTab){
  state.page = page;
  if(!keepTab) state.tab = "guide";
  var t = trackOf(page);
  document.body.className = t ? "track-"+t : "";
  if(page==="home"){
    view.innerHTML = ledger();
  } else if(page==="files"){
    view.innerHTML = filesView();
  } else {
    view.innerHTML = docView(page);
  }
  wire();
  markNav();
  navEl.classList.remove("open");
  document.getElementById("menubtn").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
  if(location.hash.slice(1)!==page) history.replaceState(null,"","#"+page);
}

function wire(){
  view.querySelectorAll("[data-page]").forEach(function(b){
    b.addEventListener("click", function(){ go(b.dataset.page); });
  });
  view.querySelectorAll("[data-dl]").forEach(function(b){
    b.addEventListener("click", function(){ download(b.dataset.dl); });
  });
  view.querySelectorAll(".tab").forEach(function(b){
    b.addEventListener("click", function(){ state.tab = b.dataset.tab; go(state.page, true); });
  });
  var pb = document.getElementById("printbtn");
  if(pb) pb.addEventListener("click", function(){ window.print(); });
}

/* ---------------- up next ---------------- */
function upNext(){
  var el = document.getElementById("upnext");
  var today = new Date();
  var items = [];
  NAV.tracks.forEach(function(t){
    t.dates.forEach(function(ds,i){
      var d = new Date(ds+" 2026 12:00");
      items.push({when:d, track:t, i:i});
    });
  });
  items.sort(function(a,b){return a.when-b.when;});
  var next = items.filter(function(x){ return x.when >= new Date(today.getFullYear(),today.getMonth(),today.getDate()); })[0];
  if(!next){ el.innerHTML = "Term complete. Spring is <b>Go</b>."; return; }
  var w = next.track.weeks[next.i];
  var label = w ? w.short : "Party";
  el.innerHTML = "Up next · "+next.track.dates[next.i]+"<br><b>"+esc(next.track.name)+" week "+(next.i+1)+"</b> — "+esc(label);
  if(w){
    el.style.cursor = "pointer";
    el.addEventListener("click", function(){ go(next.track.key+":w"+w.week); });
  }
}

document.getElementById("menubtn").addEventListener("click", function(){
  var open = navEl.classList.toggle("open");
  this.setAttribute("aria-expanded", open ? "true" : "false");
});

buildNav();
upNext();
go(location.hash ? location.hash.slice(1) : "home");
})();
</script>

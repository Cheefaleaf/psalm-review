<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPC Youth — Fall 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16232B; --ink-soft:#4A5A60; --paper:#FBFAF7; --panel:#F4F2EC;
  --rule:#CFD2CB; --rule-soft:#E3E2DB;
  --ss:#2F5D62; --wed:#7A4E2A;
  --serif:"Newsreader",Georgia,serif; --sans:"Archivo",system-ui,sans-serif;
  --sidebar:280px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:17px; line-height:1.62;
  font-variant-numeric:oldstyle-nums;
}
a{color:inherit}
button{font:inherit;color:inherit}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.side{
  width:var(--sidebar);flex:0 0 var(--sidebar);border-right:1px solid var(--rule);
  background:var(--panel);position:sticky;top:0;height:100vh;overflow-y:auto;
  font-family:var(--sans);font-size:14px;
}
.brand{padding:22px 22px 16px;border-bottom:1px solid var(--rule)}
.brand h1{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.2;margin:0}
.brand p{margin:5px 0 0;font-size:12.5px;color:var(--ink-soft);letter-spacing:.01em}
.upnext{margin:12px 22px 0;padding:9px 11px;border:1px solid var(--rule);
  background:var(--paper);font-size:12.5px;line-height:1.45;border-radius:2px}
.upnext b{font-weight:600}
nav{padding:14px 12px 40px}
.navgroup{margin-bottom:20px}
.navgroup>h2{
  font-size:13px;font-weight:600;margin:0 0 2px;padding:6px 10px;
  display:flex;align-items:baseline;gap:8px;
}
.navgroup>h2 .tick{width:3px;height:13px;display:inline-block;border-radius:1px}
.navgroup[data-track=ss] .tick{background:var(--ss)}
.navgroup[data-track=wed] .tick{background:var(--wed)}
.navgroup>h2 span.sub{font-weight:400;font-size:11.5px;color:var(--ink-soft)}
.navlink{
  display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:5px 10px 5px 21px;border-radius:2px;color:var(--ink-soft);line-height:1.35;
}
.navlink:hover{background:#EAE8E0;color:var(--ink)}
.navlink.on{background:var(--ink);color:var(--paper)}
.navlink .wk{display:inline-block;min-width:22px;color:inherit;opacity:.62;font-size:12.5px}
.navlink.stub .name::after{content:" ·  draft";opacity:.5;font-size:11.5px}
.navlink:focus-visible,.wkrow:focus-visible,.tab:focus-visible,.dl:focus-visible{
  outline:2px solid var(--ss);outline-offset:2px}

main{flex:1;min-width:0;padding:44px 6vw 90px;max-width:none}
.wrap{max-width:70ch;margin:0 auto}

/* ---------- ledger ---------- */
.ledger{max-width:900px;margin:0 auto}
.ledger-head{margin-bottom:30px}
.ledger-head h2{font-size:31px;font-weight:400;margin:0 0 6px;letter-spacing:-.01em}
.ledger-head p{margin:0;color:var(--ink-soft);max-width:62ch}
.grid{border-top:1px solid var(--ink)}
.grid-hd{display:grid;grid-template-columns:46px 1fr 1fr;gap:0;
  font-family:var(--sans);font-size:12.5px;font-weight:600;border-bottom:1px solid var(--rule)}
.grid-hd div{padding:9px 14px}
.grid-hd .h-ss{color:var(--ss);box-shadow:inset 2px 0 0 var(--ss)}
.grid-hd .h-wed{color:var(--wed);box-shadow:inset 2px 0 0 var(--wed)}
.wkrow{display:grid;grid-template-columns:46px 1fr 1fr;width:100%;
  border-bottom:1px solid var(--rule-soft);background:none;border-left:0;border-right:0;border-top:0;
  text-align:left;cursor:default;padding:0}
.wkrow>*{padding:12px 14px}
.wkn{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);padding-top:14px}
.cell{display:block;background:none;border:0;text-align:left;cursor:pointer;width:100%;
  font:inherit;color:inherit;border-radius:2px}
.cell:hover{background:#EFEDE5}
.cell .d{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);display:block}
.cell .t{display:block;line-height:1.35;margin-top:1px}
.cell.ss{box-shadow:inset 2px 0 0 rgba(47,93,98,.28)}
.cell.wed{box-shadow:inset 2px 0 0 rgba(122,78,42,.28)}
.cell.none{cursor:default;color:var(--ink-soft)}
.cell.none:hover{background:none}
.pair{border-left:0}
.wkrow.paired{background:#F4F2EC}
.pairnote{font-family:var(--sans);font-size:12px;color:var(--ink-soft);
  margin-top:14px;display:flex;gap:8px;align-items:flex-start}
.pairnote i{display:inline-block;width:11px;height:11px;background:#F4F2EC;
  border:1px solid var(--rule);flex:0 0 auto;margin-top:3px}
.mission{margin:38px 0 0;padding:20px 22px;border:1px solid var(--rule);background:var(--panel)}
.mission blockquote{margin:0;font-size:19px;line-height:1.5}
.mission p{margin:8px 0 0;font-family:var(--sans);font-size:12.5px;color:var(--ink-soft)}

/* ---------- doc view ---------- */
.docbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding-bottom:14px;margin-bottom:26px;border-bottom:1px solid var(--rule)}
.crumb{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);margin-right:auto}
.tabs{display:flex;gap:0;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.tab{background:none;border:0;padding:6px 13px;font-family:var(--sans);font-size:13px;
  cursor:pointer;color:var(--ink-soft)}
.tab+.tab{border-left:1px solid var(--rule)}
.tab.on{background:var(--ink);color:var(--paper)}
.dl{background:none;border:1px solid var(--rule);border-radius:2px;padding:6px 13px;
  font-family:var(--sans);font-size:13px;cursor:pointer;color:var(--ink)}
.dl:hover{background:var(--panel)}
.dl.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dl.solid:hover{opacity:.88}

.doc h1{font-size:32px;font-weight:400;line-height:1.2;letter-spacing:-.012em;margin:0 0 18px}
.doc h2{font-size:22px;font-weight:500;margin:38px 0 10px;padding-top:16px;border-top:1px solid var(--rule-soft)}
.doc h3{font-size:17.5px;font-weight:600;margin:26px 0 6px}
.doc p{margin:0 0 14px}
.doc ul,.doc ol{margin:0 0 15px;padding-left:22px}
.doc li{margin-bottom:5px}
.doc hr{border:0;border-top:1px solid var(--rule);margin:30px 0}
.doc blockquote{margin:18px 0;padding:12px 18px;border-left:3px solid var(--rule);
  background:var(--panel);font-size:18px}
.doc table{border-collapse:collapse;width:100%;margin:18px 0;font-size:15px;
  font-family:var(--sans);line-height:1.45}
.doc th{text-align:left;font-weight:600;border-bottom:1.5px solid var(--ink);padding:8px 10px;vertical-align:bottom}
.doc td{border-bottom:1px solid var(--rule-soft);padding:8px 10px;vertical-align:top}
.doc strong{font-weight:600}
.doc em{font-style:italic}
.doc code{font-size:.9em;background:var(--panel);padding:1px 4px}
.track-ss .doc h1,.track-ss .doc h2{color:var(--ss)}
.track-wed .doc h1,.track-wed .doc h2{color:var(--wed)}

.filelist{max-width:760px;margin:0 auto}
.filelist h2{font-size:28px;font-weight:400;margin:0 0 8px}
.filelist>p{color:var(--ink-soft);margin:0 0 26px;max-width:62ch}
.frow{display:flex;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.frow .fn{flex:1;min-width:0}
.frow .fk{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);flex:0 0 96px}

.mobonly{display:none}

/* ---------- responsive ---------- */
@media (max-width:900px){
  body{font-size:16.5px}
  .shell{display:block}
  .side{position:static;width:auto;height:auto;border-right:0;border-bottom:1px solid var(--rule)}
  nav{display:none;padding:8px 12px 22px}
  nav.open{display:block}
  .mobonly{display:block}
  .menubtn{margin:12px 22px;padding:7px 14px}
  main{padding:28px 20px 70px}
  .grid-hd,.wkrow{grid-template-columns:34px 1fr}
  .grid-hd .h-wed,.wkrow .pair{grid-column:2;border-top:1px dotted var(--rule-soft)}
  .grid-hd{display:none}
  .wkrow>.wkn{padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- print ---------- */
@media print{
  .side,.docbar,.noprint{display:none!important}
  body{background:#fff;font-size:11.5pt}
  main{padding:0}
  .wrap{max-width:none}
  .doc h1{font-size:20pt}
  .doc h2{font-size:14pt;page-break-after:avoid}
  .doc table{font-size:10pt}
  a{text-decoration:none}
}
</style>
</head>

<script id="payload" type="application/json">{"docs": {"d00": {"title": "CPC Youth — Fall 2026", "nav": "CPC Youth Fall 2026", "html": "<h1>CPC Youth — Fall 2026</h1>\n<p><strong>Sep 13 – Nov 18 · Ten weeks</strong></p>\n<p>Two tracks running in parallel, one curriculum underneath both.</p>\n<ul>\n<li><strong>Sunday School — Gather.</strong> Jr high + high school combined, 9:15–10:15, Sep 13 – Nov 15.</li>\n<li><strong>Wednesday Night — Grow.</strong> Jr high at church, high school at Black Rock, Sep 16 – Nov 18.</li>\n</ul>\n<p>Curriculum is <strong>The Journey</strong> (Life on Life Ministries). Journey pages are prep material for leaders — sent in advance each week along with condensed teacher study material. They are not used in class and students never see them.</p>\n<p>The <strong>prayer wall</strong> runs whole-group before the split on both days, every week, without exception. It is the connective thread between the two tracks.</p>\n<hr />\n<h2>The mission</h2>\n<blockquote>\n<p>We gather to faithfully worship God, grow in his grace, and go to the ends of the earth.</p>\n</blockquote>\n<p>The wall version of CPC's mission: <em>worship God faithfully, grow in the grace of the gospel, and send disciples into the world.</em></p>\n<p><strong>Gather, Grow, Go.</strong> Sundays this fall are Gather. Wednesdays are Grow. Spring is Go.</p>\n<hr />\n<h2>What's in here</h2>\n<ul>\n<li><strong>Ten-Week Schedule</strong> — both tracks side by side, with dates and Journey page references</li>\n<li><strong>Sunday School</strong> — leader overview, student overview, ten week pages, each with its handout</li>\n<li><strong>Wednesday Night</strong> — same structure</li>\n</ul>\n<p>Each week page carries its student handout as a child page, so the handout can be printed on its own without the teacher notes.</p>", "md": "# CPC Youth — Fall 2026\n\n**Sep 13 – Nov 18 · Ten weeks**\n\nTwo tracks running in parallel, one curriculum underneath both.\n\n- **Sunday School — Gather.** off party — no study</td>\n<td>—</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Sep 20</td>\n<td>God's character</td>\n<td>Red · Knowing God U1 · p. 149</td>\n<td>Sep 23</td>\n<td>Grace — the performance trap</td>\n<td>Blue · Gospel Living U3 · pp. 45–56</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Sep 27</td>\n<td>The gospel arc</td>\n<td>Blue · Gospel Living U1–6, compressed · pp. 21–91</td>\n<td>Sep 30</td>\n<td>Faith — Do or Done</td>\n<td>Blue · Gospel Living U4 · pp. 57–68</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Oct 4</td>\n<td>The Lord's Day &amp; Sabbath</td>\n<td>Red · Grace Commitments U1–2 · pp. 93, 107</td>\n<td>Oct 7</td>\n<td>Reading &amp; prayer — PRAISE + Five Targets</td>\n<td>Blue · Gospel Living U5–6 + App. A · pp. 69–91</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Oct 11</td>\n<td>Baptism</td>\n<td>Red · Grace Commitments U3 · p. 121</td>\n<td>Oct 14</td>\n<td>Justification &amp; Adoption</td>\n<td>Red · Biblical Worldview U1 · p. 245</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Oct 18</td>\n<td>The Lord's Table</td>\n<td>Red · Grace Commitments U4 · p. 135</td>\n<td>Oct 21</td>\n<td>Assurance of Salvation</td>\n<td>Red · Biblical Worldview U2 · p. 261</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Oct 25</td>\n<td>The church as family</td>\n<td>Blue · Local Church Pt 1–2 · pp. 93, 107</td>\n<td>Oct 28</td>\n<td>Sanctification <em>(alt: Why are we Presbyterian?)</em></td>\n<td>Red · Biblical Worldview U3 · p. 275</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Nov 1</td>\n<td>Spiritual gifts</td>\n<td>Blue · Local Church Pt 4 · p. 129</td>\n<td>Nov 4</td>\n<td>The Spirit <em>(alt: Charismatic friends)</em></td>\n<td>Green · Knowing God U3 · p. 167</td>\n</tr>\n<tr>\n<td>9</td>\n<td>Nov 8</td>\n<td>Serving &amp; sent</td>\n<td>Blue · Local Church Pt 3 · p. 117</td>\n<td>Nov 11</td>\n<td>God's Forgiveness <em>(alt: Catholic friends)</em></td>\n<td>Red · Knowing God U3 · p. 175</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Nov 15</td>\n<td>Party — no study</td>\n<td>—</td>\n<td>Nov 18</td>\n<td>Party — no study</td>\n<td>—</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>Notes</h2>\n<p><strong>Sunday week 1 teaches Glory (Blue U1); Wednesday picks up at Grace (Blue U3).</strong> The two tracks run the Gospel Living section in sequence rather than in parallel, which is why Wednesday's first study is week 2 and Faith stays its own week.</p>\n<p><strong>Wednesday weeks 7–9 alternates</strong> are original content, not Journey. If written by late October, swap them in. Each Journey unit listed feeds its alternate.</p>\n<p><strong>Skip all Journey unit assignments</strong> on both tracks — readings, audio, assessments. No homework. On Wednesday the weekly \"one practice\" replaces them.</p>", "md": "# Ten-Week Schedule\n\nBoth tracks, side by side. Sunday and Wednesday of the same week number sit on the same row.\n\nWeeks 5, 6 and 8 are deliberate pairings — Sunday teaches the practice, Wednesday teaches the doctrine underneath it.\n\n| Week | Sun date | Sunday — Gather | Sunday Journey | Wed date | Wednesday — Grow | Wed Journey |\n|---|---|---|---|---|---|---|\n| 1 | Sep 13 | Glory — the missing piece + our mission | Blue · Gospel Living U1 · pp. 21–32 | Sep 16 | Kickoff party — no study | — |\n| 2 | Sep 20 | God's character | Red · Knowing God U1 · p. 149 | Sep 23 | Grace — the performance trap | Blue · Gospel Living U3 · pp. 45–56 |\n| 3 | Sep 27 | The gospel arc | Blue · Gospel Living U1–6, compressed · pp. 21–91 | Sep 30 | Faith — Do or Done | Blue · Gospel Living U4 · pp. 57–68 |\n| 4 | Oct 4 | The Lord's Day & Sabbath | Red · Grace Commitments U1–2 · pp. 93, 107 | Oct 7 | Reading & prayer — PRAISE + Five Targets | Blue · Gospel Living U5–6 + App. A · pp. 69–91 |\n| 5 | Oct 11 | Baptism | Red · Grace Commitments U3 · p. 121 | Oct 14 | Justification & Adoption | Red · Biblical Worldview U1 · p. 245 |\n| 6 | Oct 18 | The Lord's Table | Red · Grace Commitments U4 · p. 135 | Oct 21 | Assurance of Salvation | Red · Biblical Worldview U2 · p. 261 |\n| 7 | Oct 25 | The church as family | Blue · Local Church Pt 1–2 · pp. 93, 107 | Oct 28 | Sanctification *(alt: Why are we Presbyterian?)* | Red · Biblical Worldview U3 · p. 275 |\n| 8 | Nov 1 | Spiritual gifts | Blue · Local Church Pt 4 · p. 129 | Nov 4 | The Spirit *(alt: Charismatic friends)* | Green · Knowing God U3 · p. 167 |\n| 9 | Nov 8 | Serving & sent | Blue · Local Church Pt 3 · p. 117 | Nov 11 | God's Forgiveness *(alt: Catholic friends)* | Red · Knowing God U3 · p. 175 |\n| 10 | Nov 15 | Party — no study | — | Nov 18 | Party — no study | — |\n\n---\n\n## Notes\n\n**Sunday week 1 teaches Glory (Blue U1); Wednesday picks up at Grace (Blue U3).** The two tracks run the Gospel Living section in sequence rather than in parallel, which is why Wednesday's first study is week 2 and Faith stays its own week.\n\n**Wednesday weeks 7–9 alternates** are original content, not Journey. If written by late October, swap them in. Each Journey unit listed feeds its alternate.\n\n**Skip all Journey unit assignments** on both tracks — readings, audio, assessments. No homework. On Wednesday the weekly \"one practice\" replaces them.\n", "file": "Ten-Week Schedule.md"}, "d02": {"title": "Sunday School", "nav": "Sunday School", "html": "<h1>Sunday School</h1>\n<p><strong>Fall · Worship (Gather)</strong>\nJr high + high school combined · Sundays 9:15–10:15 · Sep 13 – Nov 15</p>\n<p>Hard stop at 10:15 — worship starts at 10:30.</p>\n<ol>\n<li><strong>Welcome — 5 min.</strong> Settle, names, assign readers.</li>\n<li><strong>Joint teaching — 30 min.</strong> Whole room, one teacher.</li>\n<li><strong>Prayer wall — 10 min.</strong> Everyone, before any split. Every week without exception.</li>\n<li><strong>Breakout — 15 min.</strong> High school to the foyer. Jr high stays. Handout questions, then discussion.</li>\n</ol>\n<p>If the teach runs long, the breakout is what gets eaten. Watch the clock.</p>\n<p>Inside: <strong>Leader Overview</strong>, <strong>Student Overview</strong>, the <strong>Song Exercise</strong>, and one page per week with its handout as a child page.</p>", "md": "# Sunday School\n\n**Fall · Worship (Gather)**\nJr high + high school combined · Sundays 9:15–10:15 · Sep 13 – Nov 15\n\nHard stop at 10:15 — worship starts at 10:30.\n\n1. **Welcome — 5 min.** Settle, names, assign readers.\n2. **Joint teaching — 30 min.** Whole room, one teacher.\n3. **Prayer wall — 10 min.** Everyone, before any split. Every week without exception.\n4. **Breakout — 15 min.** High school to the foyer. Jr high stays. Handout questions, then discussion.\n\nIf the teach runs long, the breakout is what gets eaten. Watch the clock.\n\nInside: **Leader Overview**, **Student Overview**, the **Song Exercise**, and one page per week with its handout as a child page.\n", "file": "Sunday School.md"}, "d03": {"title": "Sunday School — Fall Overview for Leaders", "nav": "SS Leader Overview", "html": "<h1>Sunday School — Fall Overview for Leaders</h1>\n<p><strong>Fall · Worship (Gather)</strong>\nJr high + high school combined · Sundays 9:15–10:15 · Sep 13 – Nov 15</p>\n<hr />\n<h2>Journey pages for the term</h2>\n<p>Curriculum is <strong>The Journey</strong> (Life on Life Ministries). Journey pages will be sent to teachers in advance each week, along with condensed teacher study material.</p>\n<table>\n<thead>\n<tr>\n<th>Wk</th>\n<th>Date</th>\n<th>Topic</th>\n<th>Journey source</th>\n<th>Pages</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Sep 13</td>\n<td>Glory — the missing piece + our mission</td>\n<td>Blue · Gospel Living U1</td>\n<td>21–32</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Sep 20</td>\n<td>God's character</td>\n<td>Red · Knowing God U1</td>\n<td>149</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Sep 27</td>\n<td>The gospel arc</td>\n<td>Blue · Gospel Living U1–6, compressed</td>\n<td>21–91</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Oct 4</td>\n<td>The Lord's Day &amp; Sabbath</td>\n<td>Red · Grace Commitments U1–2</td>\n<td>93, 107</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Oct 11</td>\n<td>Baptism</td>\n<td>Red · Grace Commitments U3</td>\n<td>121</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Oct 18</td>\n<td>The Lord's Table</td>\n<td>Red · Grace Commitments U4</td>\n<td>135</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Oct 25</td>\n<td>The church as family</td>\n<td>Blue · Local Church Pt 1–2</td>\n<td>93, 107</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Nov 1</td>\n<td>Spiritual gifts</td>\n<td>Blue · Local Church Pt 4</td>\n<td>129</td>\n</tr>\n<tr>\n<td>9</td>\n<td>Nov 8</td>\n<td>Serving &amp; sent</td>\n<td>Blue · Local Church Pt 3</td>\n<td>117</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Nov 15</td>\n<td>Party — no study</td>\n<td>—</td>\n<td>—</td>\n</tr>\n</tbody>\n</table>\n<p>Weeks 5, 6 and 8 are taught the same week Wednesday covers the matching topic (adoption, assurance, the Spirit).</p>\n<hr />\n<h2>The hour</h2>\n<p>Hard stop at 10:15 — worship starts at 10:30.</p>\n<ol>\n<li><strong>Welcome — 5 min.</strong> Settle, names.</li>\n<li><strong>Joint teaching — 30 min.</strong> Whole room, one teacher. Jr high and high school together.</li>\n<li><strong>Prayer wall — 10 min.</strong> Everyone, before any split. Every week without exception.</li>\n<li><strong>Breakout — 15 min.</strong> High school to the foyer. Jr high stays. Handout questions, then discussion.</li>\n</ol>\n<p>If the teach runs long, the breakout is what gets eaten. Watch the clock.</p>\n<hr />\n<h2>How the Journey unit is used on Sunday</h2>\n<ul>\n<li>The unit's <strong>Truth</strong> section (memory verse, In Bible passages, To Summarize) is the 30-minute teach.</li>\n<li>One or two of the unit's <strong>Equipping</strong> or <strong>Accountability</strong> questions become the breakout handout.</li>\n<li><strong>Accountability, Mission and Supplication are not Sunday.</strong> They belong to Wednesday. Don't try to fit them in.</li>\n<li>Skip all unit assignments (readings, audio, assessments). No homework.</li>\n</ul>\n<p>Sunday is the long-study day. The breakout is short and specific, not a second lesson.</p>\n<hr />\n<h2>Staffing</h2>\n<ul>\n<li><strong>Joint teaching:</strong> one teacher. Others present, no assigned role.</li>\n<li><strong>Prayer wall:</strong> one leader facilitates.</li>\n<li><strong>Breakout:</strong> one adult in the foyer with high school, one in the room with jr high. <strong>Two adults minimum. Three is comfortable.</strong></li>\n</ul>\n<hr />\n<h2>Breakout handout</h2>\n<p>Each week's teaching doc includes a one-page student handout: three or four questions on the passage and the week's idea. Students take the first five minutes of breakout to read and write, then the leader opens discussion from what they wrote. The handout is the discussion guide — the leader doesn't need separate questions.</p>\n<hr />\n<h2>Materials each week</h2>\n<ul>\n<li>Journey pages (sent in advance)</li>\n<li>Condensed teacher study material (sent in advance)</li>\n<li>Student handout, printed — one per student</li>\n<li>Bibles (ESV)</li>\n<li>Prayer wall supplies ready before students arrive</li>\n</ul>", "md": "# Sunday School — Fall Overview for Leaders\n\n**Fall · Worship (Gather)**\nJr high + high school combined · Sundays 9:15–10:15 · Sep 13 – Nov 15\n\n---\n\n## Journey pages for the term\n\nCurriculum is **The Journey** (Life on Life Ministries). Journey pages will be sent to teachers in advance each week, along with condensed teacher study material.\n\n| Wk | Date | Topic | Journey source | Pages |\n|---|---|---|---|---|\n| 1 | Sep 13 | Glory — the missing piece + our mission | Blue · Gospel Living U1 | 21–32 |\n| 2 | Sep 20 | God's character | Red · Knowing God U1 | 149 |\n| 3 | Sep 27 | The gospel arc | Blue · Gospel Living U1–6, compressed | 21–91 |\n| 4 | Oct 4 | The Lord's Day & Sabbath | Red · Grace Commitments U1–2 | 93, 107 |\n| 5 | Oct 11 | Baptism | Red · Grace Commitments U3 | 121 |\n| 6 | Oct 18 | The Lord's Table | Red · Grace Commitments U4 | 135 |\n| 7 | Oct 25 | The church as family | Blue · Local Church Pt 1–2 | 93, 107 |\n| 8 | Nov 1 | Spiritual gifts | Blue · Local Church Pt 4 | 129 |\n| 9 | Nov 8 | Serving & sent | Blue · Local Church Pt 3 | 117 |\n| 10 | Nov 15 | Party — no study | — | — |\n\nWeeks 5, 6 and 8 are taught the same week Wednesday covers the matching topic (adoption, assurance, the Spirit).\n\n---\n\n## The hour\n\nHard stop at 10:15 — worship starts at 10:30.\n\n1. **Welcome — 5 min.** Settle, names.\n2. **Joint teaching — 30 min.** Whole room, one teacher. Jr high and high school together.\n3. **Prayer wall — 10 min.** Everyone, before any split. Every week without exception.\n4. **Breakout — 15 min.** High school to the foyer. Jr high stays. Handout questions, then discussion.\n\nIf the teach runs long, the breakout is what gets eaten. Watch the clock.\n\n---\n\n## How the Journey unit is used on Sunday\n\n- The unit's **Truth** section (memory verse, In Bible passages, To Summarize) is the 30-minute teach.\n- One or two of the unit's **Equipping** or **Accountability** questions become the breakout handout.\n- **Accountability, Mission and Supplication are not Sunday.** They belong to Wednesday. Don't try to fit them in.\n- Skip all unit assignments (readings, audio, assessments). No homework.\n\nSunday is the long-study day. The breakout is short and specific, not a second lesson.\n\n---\n\n## Staffing\n\n- **Joint teaching:** one teacher. Others present, no assigned role.\n- **Prayer wall:** one leader facilitates.\n- **Breakout:** one adult in the foyer with high school, one in the room with jr high. **Two adults minimum. Three is comfortable.**\n\n---\n\n## Breakout handout\n\nEach week's teaching doc includes a one-page student handout: three or four questions on the passage and the week's idea. Students take the first five minutes of breakout to read and write, then the leader opens discussion from what they wrote. The handout is the discussion guide — the leader doesn't need separate questions.\n\n---\n\n## Materials each week\n\n- Journey pages (sent in advance)\n- Condensed teacher study material (sent in advance)\n- Student handout, printed — one per student\n- Bibles (ESV)\n- Prayer wall supplies ready before students arrive\n", "file": "SS Leader Overview.md"}, "d04": {"title": "Sunday School This Fall", "nav": "SS Student Overview", "html": "<h1>Sunday School This Fall</h1>\n<p><strong>Why We Worship</strong>\nSundays · 9:15–10:15 · Sep 13 – Nov 15</p>\n<hr />\n<h2>What this is</h2>\n<p>This fall we're asking one question on Sunday mornings: <strong>why do we worship?</strong> Not just \"why go to church,\" but what all of it actually is — the Lord's Day, baptism, communion, the church — and why any of it matters.</p>\n<p>We're using a curriculum called <strong>The Journey</strong>. You won't get homework from it. Everything happens in the room.</p>\n<hr />\n<h2>How Sunday runs</h2>\n<ul>\n<li><strong>9:15</strong> — Everyone together. Jr high and high school in one room.</li>\n<li><strong>Teaching</strong> — About thirty minutes. One passage, one idea.</li>\n<li><strong>Prayer wall</strong> — All of us, every single week. Write one thing. We pray for it.</li>\n<li><strong>Breakout</strong> — High school heads to the foyer, jr high stays. You get a short handout with a few questions. Five minutes to read and write, then we talk.</li>\n<li><strong>10:15</strong> — Done. Worship at 10:30.</li>\n</ul>\n<hr />\n<h2>Where we're going</h2>\n<table>\n<thead>\n<tr>\n<th>Date</th>\n<th>What we're looking at</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Sep 13</td>\n<td>Glory — what everyone's actually looking for, and who we are</td>\n</tr>\n<tr>\n<td>Sep 20</td>\n<td>Who God is</td>\n</tr>\n<tr>\n<td>Sep 27</td>\n<td>The gospel — the whole thing in one morning</td>\n</tr>\n<tr>\n<td>Oct 4</td>\n<td>The Lord's Day — why Sunday</td>\n</tr>\n<tr>\n<td>Oct 11</td>\n<td>Baptism</td>\n</tr>\n<tr>\n<td>Oct 18</td>\n<td>Communion</td>\n</tr>\n<tr>\n<td>Oct 25</td>\n<td>The church as a family</td>\n</tr>\n<tr>\n<td>Nov 1</td>\n<td>Your place in it — spiritual gifts</td>\n</tr>\n<tr>\n<td>Nov 8</td>\n<td>Being sent out</td>\n</tr>\n<tr>\n<td>Nov 15</td>\n<td>Party</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>Why \"Gather\"</h2>\n<p>Our church's mission is to <strong>worship God faithfully, grow in the grace of the gospel, and send disciples into the world.</strong> We say it as <strong>Gather, Grow, Go.</strong> Sundays this fall are Gather. Wednesdays are Grow. Spring is Go.</p>\n<p>You're not the junior version of this church. You're doing the same thing everyone else is.</p>", "md": "# Sunday School This Fall\n\n**Why We Worship**\nSundays · 9:15–10:15 · Sep 13 – Nov 15\n\n---\n\n## What this is\n\nThis fall we're asking one question on Sunday mornings: **why do we worship?** Not just \"why go to church,\" but what all of it actually is — the Lord's Day, baptism, communion, the church — and why any of it matters.\n\nWe're using a curriculum called **The Journey**. You won't get homework from it. Everything happens in the room.\n\n---\n\n## How Sunday runs\n\n- **9:15** — Everyone together. Jr high and high school in one room.\n- **Teaching** — About thirty minutes. One passage, one idea.\n- **Prayer wall** — All of us, every single week. Write one thing. We pray for it.\n- **Breakout** — High school heads to the foyer, jr high stays. You get a short handout with a few questions. Five minutes to read and write, then we talk.\n- **10:15** — Done. Worship at 10:30.\n\n---\n\n## Where we're going\n\n| Date | What we're looking at |\n|---|---|\n| Sep 13 | Glory — what everyone's actually looking for, and who we are |\n| Sep 20 | Who God is |\n| Sep 27 | The gospel — the whole thing in one morning |\n| Oct 4 | The Lord's Day — why Sunday |\n| Oct 11 | Baptism |\n| Oct 18 | Communion |\n| Oct 25 | The church as a family |\n| Nov 1 | Your place in it — spiritual gifts |\n| Nov 8 | Being sent out |\n| Nov 15 | Party |\n\n---\n\n## Why \"Gather\"\n\nOur church's mission is to **worship God faithfully, grow in the grace of the gospel, and send disciples into the world.** We say it as **Gather, Grow, Go.** Sundays this fall are Gather. Wednesdays are Grow. Spring is Go.\n\nYou're not the junior version of this church. You're doing the same thing everyone else is.\n", "file": "SS Student Overview.md"}, "d05": {"title": "Song Exercise — Spotting the Act of Giving Glory", "nav": "SS Song Exercise - Giving Glory", "html": "<h1>Song Exercise — Spotting the Act of Giving Glory</h1>\n<p>Handout or slides. Students mark every line that <em>overtly ascribes glory to God</em> — not lines about us, not petition, not testimony. The act itself.</p>\n<p><strong>The point:</strong> some songs do it head to toe. Some do it in a line or two. Knowing the difference is knowing what you're doing while you sing.</p>\n<hr />\n<h2>Where it goes</h2>\n<p><strong>Week 1 (Sep 13) — one song, 4 min, as the hook.</strong>\nHoly, Holy, Holy on the screen. \"Mark every line where we're giving God glory.\" Every line qualifies. That's the point. Then: what is that word? → Bible Hub → weight → Psalm 8.</p>\n<p><strong>Week 4 (Oct 4, The Lord's Day) — full exercise, 10–12 min.</strong>\nThree or four songs in contrast. Whole-song, line-or-two, almost-none. Then the question: <em>what were you doing during the parts that weren't ascription?</em> That's the Lord's Day conversation.</p>\n<hr />\n<h2>Head to toe — public domain</h2>\n<h3>Holy, Holy, Holy · Reginald Heber, 1826</h3>\n<p>Holy, holy, holy! Lord God Almighty!\nEarly in the morning our song shall rise to Thee;\nHoly, holy, holy, merciful and mighty!\nGod in three Persons, blessed Trinity!</p>\n<p>Holy, holy, holy! All the saints adore Thee,\nCasting down their golden crowns around the glassy sea;\nCherubim and seraphim falling down before Thee,\nWhich wert, and art, and evermore shalt be.</p>\n<p>Holy, holy, holy! Though the darkness hide Thee,\nThough the eye of sinful man Thy glory may not see;\nOnly Thou art holy; there is none beside Thee,\nPerfect in power, in love, and purity.</p>\n<p>Holy, holy, holy! Lord God Almighty!\nAll Thy works shall praise Thy name, in earth, and sky, and sea;\nHoly, holy, holy, merciful and mighty!\nGod in three Persons, blessed Trinity!</p>\n<p><em>Every line. Verse 2 is Revelation 4 — the elders casting crowns. Verse 3 has the word itself: \"Thy glory.\"</em></p>\n<h3>Immortal, Invisible, God Only Wise · Walter Chalmers Smith, 1867</h3>\n<p>Immortal, invisible, God only wise,\nIn light inaccessible hid from our eyes,\nMost blessed, most glorious, the Ancient of Days,\nAlmighty, victorious, Thy great name we praise.</p>\n<p>Unresting, unhasting, and silent as light,\nNor wanting, nor wasting, Thou rulest in might;\nThy justice like mountains high soaring above\nThy clouds which are fountains of goodness and love.</p>\n<p>To all, life Thou givest, to both great and small;\nIn all life Thou livest, the true life of all;\nWe blossom and flourish as leaves on the tree,\nAnd wither and perish — but naught changeth Thee.</p>\n<p>Great Father of glory, pure Father of light,\nThine angels adore Thee, all veiling their sight;\nAll praise we would render; O help us to see\n'Tis only the splendor of light hideth Thee.</p>\n<p><em>Nearly every line is an attribute named to His face. The one exception is worth catching: verse 4 line 3 turns to petition — \"O help us to see.\" Even a head-to-toe song has a seam.</em></p>\n<hr />\n<h2>A line or two — public domain</h2>\n<h3>Be Thou My Vision · Irish, tr. Mary Byrne 1905, vers. Eleanor Hull 1912</h3>\n<p>Be Thou my Vision, O Lord of my heart;\nNaught be all else to me, save that Thou art;\nThou my best thought, by day or by night,\nWaking or sleeping, Thy presence my light.</p>\n<p>Be Thou my Wisdom, and Thou my true Word;\nI ever with Thee and Thou with me, Lord;\nThou my great Father, I Thy true son;\nThou in me dwelling, and I with Thee one.</p>\n<p>Riches I heed not, nor man's empty praise,\nThou mine inheritance, now and always:\nThou and Thou only, first in my heart,\nHigh King of Heaven, my Treasure Thou art.</p>\n<p>High King of Heaven, my victory won,\nMay I reach Heaven's joys, O bright Heaven's Sun!\nHeart of my own heart, whatever befall,\nStill be my Vision, O Ruler of all.</p>\n<p><em>Almost entirely petition — \"be Thou.\" The ascription is in the names: \"High King of Heaven,\" \"O Ruler of all,\" \"bright Heaven's Sun.\" Verse 3, line 1 is a direct hit on the counterfeits — \"nor man's empty praise.\" Worth pointing at in week 1 if you use this one.</em></p>\n<hr />\n<h2>Almost none — public domain</h2>\n<h3>Amazing Grace · John Newton, 1779</h3>\n<p>Amazing grace! how sweet the sound,\nThat saved a wretch like me!\nI once was lost, but now am found,\nWas blind, but now I see.</p>\n<p>'Twas grace that taught my heart to fear,\nAnd grace my fears relieved;\nHow precious did that grace appear\nThe hour I first believed!</p>\n<p>Through many dangers, toils, and snares,\nI have already come;\n'Tis grace hath brought me safe thus far,\nAnd grace will lead me home.</p>\n<p>The Lord has promised good to me,\nHis word my hope secures;\nHe will my shield and portion be,\nAs long as life endures.</p>\n<p><em>Testimony, first person, start to finish. God is spoken about, not to. The nearest thing to ascription is verse 4 — \"He will my shield and portion be.\" Still not addressed to Him. Not a lesser song. A different act. That's the lesson.</em></p>\n<hr />\n<h2>Modern songs — pull lyrics from your app or CCLI</h2>\n<p>Titles and where the ascription sits. Not reproduced here.</p>\n<p><strong>Head to toe</strong>\n- <strong>God Omniscient, God All Knowing</strong> (Boswell / Papa) — attribute after attribute, addressed to Him.\n- <strong>How Great Is Our God</strong> (Tomlin) — the chorus is pure ascription; verses name attributes.\n- <strong>Holy Forever</strong> (Wickham) — Revelation 4 again. Whole thing.\n- <strong>Great Are You Lord</strong> (All Sons &amp; Daughters) — ascription plus one line that names the act itself.</p>\n<p><strong>A line or two</strong>\n- <strong>10,000 Reasons</strong> (Redman) — mostly exhortation to self. The ascription is in the bridge and a few verse lines.\n- <strong>Goodness of God</strong> (Bethel) — testimony, like Amazing Grace, with ascription in the chorus.\n- <strong>Build My Life</strong> (Housefires) — petition, with a stack of ascription lines in verse 1.\n- <strong>Living Hope</strong> (Wickham) — narrative until the refrain.</p>\n<p><strong>Almost none</strong>\n- <strong>In Christ Alone</strong> (Getty / Townend) — creed sung in first person. Overt ascription is rare; the song is confession, not address.</p>\n<hr />\n<h2>Slides</h2>\n<p>One song per slide, full text. Second version of each slide with the ascription lines highlighted. Advance from plain to highlighted after students have marked their handouts.</p>\n<p>For the week 4 contrast, order them: Holy, Holy, Holy → Be Thou My Vision → Amazing Grace → one modern head-to-toe. Ends on the point.</p>\n<hr />\n<h2>The question at the end</h2>\n<p><em>During the lines that weren't giving glory — what were you doing?</em></p>\n<p>Confessing. Asking. Remembering. Telling your own story. All of it is worship. Only some of it is ascription. Knowing which is which while you're singing is the whole skill.</p>", "md": "# Song Exercise — Spotting the Act of Giving Glory\n\nHandout or slides. Students mark every line that *overtly ascribes glory to God* — not lines about us, not petition, not testimony. The act itself.\n\n**The point:** some songs do it head to toe. Some do it in a line or two. Knowing the difference is knowing what you're doing while you sing.\n\n---\n\n## Where it goes\n\n**Week 1 (Sep 13) — one song, 4 min, as the hook.**\nHoly, Holy, Holy on the screen. \"Mark every line where we're giving God glory.\" Every line qualifies. That's the point. Then: what is that word? → Bible Hub → weight → Psalm 8.\n\n**Week 4 (Oct 4, The Lord's Day) — full exercise, 10–12 min.**\nThree or four songs in contrast. Whole-song, line-or-two, almost-none. Then the question: *what were you doing during the parts that weren't ascription?* That's the Lord's Day conversation.\n\n---\n\n## Head to toe — public domain\n\n### Holy, Holy, Holy · Reginald Heber, 1826\n\nHoly, holy, holy! Lord God Almighty!\nEarly in the morning our song shall rise to Thee;\nHoly, holy, holy, merciful and mighty!\nGod in three Persons, blessed Trinity!\n\nHoly, holy, holy! All the saints adore Thee,\nCasting down their golden crowns around the glassy sea;\nCherubim and seraphim falling down before Thee,\nWhich wert, and art, and evermore shalt be.\n\nHoly, holy, holy! Though the darkness hide Thee,\nThough the eye of sinful man Thy glory may not see;\nOnly Thou art holy; there is none beside Thee,\nPerfect in power, in love, and purity.\n\nHoly, holy, holy! Lord God Almighty!\nAll Thy works shall praise Thy name, in earth, and sky, and sea;\nHoly, holy, holy, merciful and mighty!\nGod in three Persons, blessed Trinity!\n\n*Every line. Verse 2 is Revelation 4 — the elders casting crowns. Verse 3 has the word itself: \"Thy glory.\"*\n\n### Immortal, Invisible, God Only Wise · Walter Chalmers Smith, 1867\n\nImmortal, invisible, God only wise,\nIn light inaccessible hid from our eyes,\nMost blessed, most glorious, the Ancient of Days,\nAlmighty, victorious, Thy great name we praise.\n\nUnresting, unhasting, and silent as light,\nNor wanting, nor wasting, Thou rulest in might;\nThy justice like mountains high soaring above\nThy clouds which are fountains of goodness and love.\n\nTo all, life Thou givest, to both great and small;\nIn all life Thou livest, the true life of all;\nWe blossom and flourish as leaves on the tree,\nAnd wither and perish — but naught changeth Thee.\n\nGreat Father of glory, pure Father of light,\nThine angels adore Thee, all veiling their sight;\nAll praise we would render; O help us to see\n'Tis only the splendor of light hideth Thee.\n\n*Nearly every line is an attribute named to His face. The one exception is worth catching: verse 4 line 3 turns to petition — \"O help us to see.\" Even a head-to-toe song has a seam.*\n\n---\n\n## A line or two — public domain\n\n### Be Thou My Vision · Irish, tr. Mary Byrne 1905, vers. Eleanor Hull 1912\n\nBe Thou my Vision, O Lord of my heart;\nNaught be all else to me, save that Thou art;\nThou my best thought, by day or by night,\nWaking or sleeping, Thy presence my light.\n\nBe Thou my Wisdom, and Thou my true Word;\nI ever with Thee and Thou with me, Lord;\nThou my great Father, I Thy true son;\nThou in me dwelling, and I with Thee one.\n\nRiches I heed not, nor man's empty praise,\nThou mine inheritance, now and always:\nThou and Thou only, first in my heart,\nHigh King of Heaven, my Treasure Thou art.\n\nHigh King of Heaven, my victory won,\nMay I reach Heaven's joys, O bright Heaven's Sun!\nHeart of my own heart, whatever befall,\nStill be my Vision, O Ruler of all.\n\n*Almost entirely petition — \"be Thou.\" The ascription is in the names: \"High King of Heaven,\" \"O Ruler of all,\" \"bright Heaven's Sun.\" Verse 3, line 1 is a direct hit on the counterfeits — \"nor man's empty praise.\" Worth pointing at in week 1 if you use this one.*\n\n---\n\n## Almost none — public domain\n\n### Amazing Grace · John Newton, 1779\n\nAmazing grace! how sweet the sound,\nThat saved a wretch like me!\nI once was lost, but now am found,\nWas blind, but now I see.\n\n'Twas grace that taught my heart to fear,\nAnd grace my fears relieved;\nHow precious did that grace appear\nThe hour I first believed!\n\nThrough many dangers, toils, and snares,\nI have already come;\n'Tis grace hath brought me safe thus far,\nAnd grace will lead me home.\n\nThe Lord has promised good to me,\nHis word my hope secures;\nHe will my shield and portion be,\nAs long as life endures.\n\n*Testimony, first person, start to finish. God is spoken about, not to. The nearest thing to ascription is verse 4 — \"He will my shield and portion be.\" Still not addressed to Him. Not a lesser song. A different act. That's the lesson.*\n\n---\n\n## Modern songs — pull lyrics from your app or CCLI\n\nTitles and where the ascription sits. Not reproduced here.\n\n**Head to toe**\n- **God Omniscient, God All Knowing** (Boswell / Papa) — attribute after attribute, addressed to Him.\n- **How Great Is Our God** (Tomlin) — the chorus is pure ascription; verses name attributes.\n- **Holy Forever** (Wickham) — Revelation 4 again. Whole thing.\n- **Great Are You Lord** (All Sons & Daughters) — ascription plus one line that names the act itself.\n\n**A line or two**\n- **10,000 Reasons** (Redman) — mostly exhortation to self. The ascription is in the bridge and a few verse lines.\n- **Goodness of God** (Bethel) — testimony, like Amazing Grace, with ascription in the chorus.\n- **Build My Life** (Housefires) — petition, with a stack of ascription lines in verse 1.\n- **Living Hope** (Wickham) — narrative until the refrain.\n\n**Almost none**\n- **In Christ Alone** (Getty / Townend) — creed sung in first person. Overt ascription is rare; the song is confession, not address.\n\n---\n\n## Slides\n\nOne song per slide, full text. Second version of each slide with the ascription lines highlighted. Advance from plain to highlighted after students have marked their handouts.\n\nFor the week 4 contrast, order them: Holy, Holy, Holy → Be Thou My Vision → Amazing Grace → one modern head-to-toe. Ends on the point.\n\n---\n\n## The question at the end\n\n*During the lines that weren't giving glory — what were you doing?*\n\nConfessing. Asking. Remembering. Telling your own story. All of it is worship. Only some of it is ascription. Knowing which is which while you're singing is the whole skill.\n", "file": "SS Song Exercise - Giving Glory.md"}, "d06": {"title": "Sunday School · Week 1 — Glory", "nav": "SS Week 1 - Glory", "html": "<h1>Sunday School · Week 1 — Glory</h1>\n<p><strong>Teacher's Guide · Sep 13 · 9:15–10:15</strong>\nJr high + high school combined</p>\n<p><strong>Prep:</strong> Journey Blue Year, Gospel Living Unit 1, \"Glory — Why We Embrace Christ,\" pp. 21–32. Read before Sunday. Not used in class.\n<strong>Memory verse:</strong> John 1:14\n<strong>Readers needed:</strong> 5 (assign as students arrive)\n<strong>Materials:</strong> student handouts · Bibles (ESV) · Holy, Holy, Holy on the screen · Bible Hub up · whiteboard · prayer wall supplies ready before 9:15</p>\n<hr />\n<h2>Big idea</h2>\n<p>Everyone is searching for the one thing that will finally satisfy. The Bible's name for that missing piece is <strong>glory</strong> — not God's majesty, not praising God, but the glory God <em>gives</em> to people. We were made to be crowned with it. We traded it away. Now we chase counterfeits. Jesus is where it's found again: <em>Christ in you, the hope of glory.</em></p>\n<p><strong>The mission tie-in:</strong> Journey says what gives glory to God is renouncing counterfeit glories and placing our hope of satisfaction in Him alone. That is our mission statement in one sentence.</p>\n<hr />\n<h2>Condensed teacher study material</h2>\n<p><em>From Journey pp. 22–25. Read the full pages; this is the spine.</em></p>\n<p><strong>The missing piece (p. 24).</strong> Every person — religious or not — is searching for something that will satisfy permanently. Journey's image: everyone is a puzzle with one vital piece missing. People call it happiness, meaning, significance, fulfillment. They look for it in experiences, pleasures, relationships. Most never find it.</p>\n<p><strong>Three senses of \"glory\" (p. 24).</strong> Journey is careful here and you should be too:\n1. God's glory — His awesome majesty. (Not this week's sense.)\n2. Giving glory to God — acknowledging Him in worship. (Not this week's sense.)\n3. <strong>Glory <em>from</em> God — the glory He bestows on people to satisfy them.</strong> This one.</p>\n<p>Kids will default to 1 or 2. If they hear \"God is awesome,\" the lesson didn't land.</p>\n<p><strong>The story of glory (p. 24).</strong>\n- <em>Designed for it.</em> Psalm 8:5 — God crowned humanity with glory and honor.\n- <em>Forfeited.</em> Romans 1:21–23 — they knew God, didn't glorify or thank Him, and exchanged His glory for images.\n- <em>The search.</em> Because we weren't built to be without it, we go after counterfeit, temporary glories. Journey's phrase: an addiction to <strong>praise, power, and pleasure</strong>, going from toy to toy, fix to fix, relationship to relationship.\n- <em>Recovered.</em> Colossians 1:27 — Christ in you, the hope of glory.</p>\n<p><strong>\"Christ in you\" = born again (p. 25).</strong> John 3:3. Journey's point: there's no such thing as a Christian who isn't born again — that's like being semi-married. Not a real category. The initial deposit of glory ends the search; God keeps pouring more in over a lifetime.</p>\n<p><strong>How to give glory to God (p. 25).</strong> Renounce all counterfeit glories; place your hope of satisfaction in Him alone. Philippians 3:7–9 — Paul counted his gains (status, power, praise, self-righteousness) as loss. Clinging to a counterfeit as necessary for satisfaction is idolatry, even when the thing itself isn't bad.</p>\n<hr />\n<h2>9:15 — Welcome · 5 min</h2>\n<p>Names. Assign readers. Hand out Bibles.</p>\n<hr />\n<h2>9:20 — The wall · 5 min</h2>\n<p>Point to the mission statement on the wall. Have one student read it aloud.</p>\n<blockquote>\n<p><em>We gather to faithfully worship God, grow in his grace, and go to the ends of the earth.</em></p>\n</blockquote>\n<ul>\n<li>This is CPC's mission statement. Not a youth group slogan — the whole church.</li>\n<li>Three words in it: gather, grow, go. Sundays this fall are <strong>Gather</strong>. Wednesdays are <strong>Grow</strong>. Spring is <strong>Go</strong>.</li>\n<li>You are not the junior version of this church. You're doing what everyone here is doing.</li>\n<li>Today's question: what does \"worship God\" have to do with what you're actually looking for in life? We come back to the wall at the end.</li>\n</ul>\n<hr />\n<h2>9:25 — Teaching · 25 min</h2>\n<h3>A · The word — 7 min</h3>\n<p><strong>Holy, Holy, Holy on the screen.</strong> Mark every line where we're giving God glory. Give them a minute. Every line qualifies — that's the point. (Lyrics in the song exercise doc.)</p>\n<p><strong>Ask:</strong> so what does <em>glory</em> mean? Take everything. No correcting yet.\n- Expect: God being awesome, praising God, winning, fame, \"glory days.\"\n- All of those are in the neighborhood. Hold them.</p>\n<p><strong>Bible Hub, together.</strong>\n- Hebrew <strong>kabod</strong> — root meaning <em>weight, heaviness.</em> Something with substance. Something that matters.\n- Greek <strong>doxa</strong> — <em>reputation, splendor, what something is really worth.</em>\n- Quick reference: the Greeks had another word for it — <strong>kleos</strong>, fame, \"what's heard about you.\" They knew glory was the biggest thing there was. The whole <em>Iliad</em> runs on it. Hold that for later.\n- Glory = weight. Real, substantial worth. Keep that word in play the rest of the hour.</p>\n<h3>B · The songs — 3 min</h3>\n<p>Second song on the screen. Mark only the lines that are <em>giving God glory</em>. Fewer hands go up. Some songs do it head to toe; some do it in a line or two.</p>\n<p>The takeaway before we go to Scripture: giving glory is a specific act, not a mood. Now — what is the thing being given?</p>\n<h3>C · Into the Word — 5 min</h3>\n<p><strong>Reader 1 — Psalm 8:5</strong>\n- Who is being crowned? With what?\n- Concept: glory is something God <em>gives to people.</em> Not just something God has. Not just something we give Him. Made for it.</p>\n<p><strong>Reader 2 — Romans 1:21–23</strong>\n- What did they know? What did they do with it? What did they trade?\n- Concept: knew God, didn't honor Him, swapped His glory for images. Lost the weight. Took something lighter.\n- Note the two directions in this one passage — <em>glorify Him</em> (worship) vs. <em>the glory of God</em> (His). Both real. Psalm 8 gave us a third: glory <em>from</em> God to us. That's the one we're chasing today.</p>\n<h3>D · So what — 5 min</h3>\n<p>Built to carry weight. The weight is gone. Nobody stops wanting it. So everyone gets heavy some other way.</p>\n<p><strong>Ask:</strong> what do people your age trade it for? What's the image?\n- Push past generic. The post, the roster spot, the relationship, the grade, being liked.\n- Three buckets to name once the answers are up: <strong>praise, power, pleasure.</strong>\n- Toy to toy. Fix to fix. Relationship to relationship. It never lands, because it isn't the thing.</p>\n<p><strong>Achilles.</strong> The Greeks idolized kleos. Achilles chose it over a long life — die young at Troy and be remembered forever. Then in the <em>Odyssey</em>, Odysseus finds his ghost in the underworld and tries to comfort him: you're honored like a god down here. Achilles says he'd rather be a farmhand for some nobody than king of the dead. The man who picked glory over everything would trade all of it to be alive as a nobody. Counterfeit glory, at the end, weighs nothing.</p>\n<p>The point: glory isn't a church word. It's the thing under every want you have. That's why it matters.</p>\n<h3>E · The answer — 3 min</h3>\n<p><strong>Reader 3 — Colossians 1:27</strong>\n- Where is glory now, according to Paul?\n- Concept: <em>Christ in you, the hope of glory.</em> Not hope in general — hope of <em>that.</em> The thing we traded is found in a person.</p>\n<p><strong>Reader 4 — John 1:14</strong>\n- Memory verse. What became visible?\n- Concept: glory took on flesh. You could look at it.</p>\n<h3>F · Back to the wall — 2 min</h3>\n<p><strong>Reader 5 — Philippians 3:7–8</strong>\n- What did Paul count as loss? What was worth more?\n- Concept: giving glory to God means letting go of the counterfeits and putting the weight on Him alone. That's what \"faithfully worship God\" on the wall means.</p>\n<p>Christ, Community, Calling — quick:\n- <strong>Christ</strong> — the weight is on Him. Everything else follows.\n- <strong>Community</strong> — we let go of the fakes <em>together.</em> We believe something and can say it. We treat each other like it's true.\n- <strong>Calling</strong> — what you do because of the first two.</p>\n<p>That's the wall. That's who we are.</p>\n<hr />\n<h2>9:50 — Prayer wall · 10 min</h2>\n<p>First use. Explain once: one thing each — hard, hoped-for, thankful. Every week, both days, never skipped.</p>\n<p>Everyone writes. Read them or let students say them. Pray.</p>\n<hr />\n<h2>10:00 — Breakout · 15 min</h2>\n<p>High school → foyer. Jr high → stays.</p>\n<p><strong>5 min silent.</strong> Read Colossians 1:15–28, write answers on the handout.</p>\n<p><strong>10 min discussion.</strong> Leader opens from question 2, not question 1.</p>\n<p><strong>Leader notes</strong>\n- Question 2 is where it goes quiet. Let it.\n- Question 4 is not a test. \"Christian, but not sure about born-again\" is the most useful answer in the room. Ask what they mean. Don't fix it.\n- Jr high: read the passage aloud first.\n- High school: question 5 gets the last few minutes. Let them answer it.</p>\n<hr />\n<h2>10:15 — Done</h2>\n<p>Collect handouts if you want to read them. Worship at 10:30.</p>\n<hr />\n<h2>Watch-outs</h2>\n<ul>\n<li>Don't let glory stay churchy.</li>\n<li>Order matters more than memorization on the mission — Christ first, community isn't a club. Nobody needs to recite three C's.</li>\n<li>Section D is the fullest part of the teach. If it runs long, compress the Achilles bit rather than cutting it — one sentence each on the choice and the ghost still lands it.</li>\n<li>Prayer wall supplies ready before 9:15.</li>\n<li>Twenty-five minutes is the ceiling on the teach.</li>\n</ul>", "md": "# Sunday School · Week 1 — Glory\n\n**Teacher's Guide · Sep 13 · 9:15–10:15**\nJr high + high school combined\n\n**Prep:** Journey Blue Year, Gospel Living Unit 1, \"Glory — Why We Embrace Christ,\" pp. 21–32. Read before Sunday. Not used in class.\n**Memory verse:** John 1:14\n**Readers needed:** 5 (assign as students arrive)\n**Materials:** student handouts · Bibles (ESV) · Holy, Holy, Holy on the screen · Bible Hub up · whiteboard · prayer wall supplies ready before 9:15\n\n---\n\n## Big idea\n\nEveryone is searching for the one thing that will finally satisfy. The Bible's name for that missing piece is **glory** — not God's majesty, not praising God, but the glory God *gives* to people. We were made to be crowned with it. We traded it away. Now we chase counterfeits. Jesus is where it's found again: *Christ in you, the hope of glory.*\n\n**The mission tie-in:** Journey says what gives glory to God is renouncing counterfeit glories and placing our hope of satisfaction in Him alone. That is our mission statement in one sentence.\n\n---\n\n## Condensed teacher study material\n\n*From Journey pp. 22–25. Read the full pages; this is the spine.*\n\n**The missing piece (p. 24).** Every person — religious or not — is searching for something that will satisfy permanently. Journey's image: everyone is a puzzle with one vital piece missing. People call it happiness, meaning, significance, fulfillment. They look for it in experiences, pleasures, relationships. Most never find it.\n\n**Three senses of \"glory\" (p. 24).** Journey is careful here and you should be too:\n1. God's glory — His awesome majesty. (Not this week's sense.)\n2. Giving glory to God — acknowledging Him in worship. (Not this week's sense.)\n3. **Glory *from* God — the glory He bestows on people to satisfy them.** This one.\n\nKids will default to 1 or 2. If they hear \"God is awesome,\" the lesson didn't land.\n\n**The story of glory (p. 24).**\n- *Designed for it.* Psalm 8:5 — God crowned humanity with glory and honor.\n- *Forfeited.* Romans 1:21–23 — they knew God, didn't glorify or thank Him, and exchanged His glory for images.\n- *The search.* Because we weren't built to be without it, we go after counterfeit, temporary glories. Journey's phrase: an addiction to **praise, power, and pleasure**, going from toy to toy, fix to fix, relationship to relationship.\n- *Recovered.* Colossians 1:27 — Christ in you, the hope of glory.\n\n**\"Christ in you\" = born again (p. 25).** John 3:3. Journey's point: there's no such thing as a Christian who isn't born again — that's like being semi-married. Not a real category. The initial deposit of glory ends the search; God keeps pouring more in over a lifetime.\n\n**How to give glory to God (p. 25).** Renounce all counterfeit glories; place your hope of satisfaction in Him alone. Philippians 3:7–9 — Paul counted his gains (status, power, praise, self-righteousness) as loss. Clinging to a counterfeit as necessary for satisfaction is idolatry, even when the thing itself isn't bad.\n\n---\n\n## 9:15 — Welcome · 5 min\n\nNames. Assign readers. Hand out Bibles.\n\n---\n\n## 9:20 — The wall · 5 min\n\nPoint to the mission statement on the wall. Have one student read it aloud.\n\n> *We gather to faithfully worship God, grow in his grace, and go to the ends of the earth.*\n\n- This is CPC's mission statement. Not a youth group slogan — the whole church.\n- Three words in it: gather, grow, go. Sundays this fall are **Gather**. Wednesdays are **Grow**. Spring is **Go**.\n- You are not the junior version of this church. You're doing what everyone here is doing.\n- Today's question: what does \"worship God\" have to do with what you're actually looking for in life? We come back to the wall at the end.\n\n---\n\n## 9:25 — Teaching · 25 min\n\n### A · The word — 7 min\n\n**Holy, Holy, Holy on the screen.** Mark every line where we're giving God glory. Give them a minute. Every line qualifies — that's the point. (Lyrics in the song exercise doc.)\n\n**Ask:** so what does *glory* mean? Take everything. No correcting yet.\n- Expect: God being awesome, praising God, winning, fame, \"glory days.\"\n- All of those are in the neighborhood. Hold them.\n\n**Bible Hub, together.**\n- Hebrew **kabod** — root meaning *weight, heaviness.* Something with substance. Something that matters.\n- Greek **doxa** — *reputation, splendor, what something is really worth.*\n- Quick reference: the Greeks had another word for it — **kleos**, fame, \"what's heard about you.\" They knew glory was the biggest thing there was. The whole *Iliad* runs on it. Hold that for later.\n- Glory = weight. Real, substantial worth. Keep that word in play the rest of the hour.\n\n### B · The songs — 3 min\n\nSecond song on the screen. Mark only the lines that are *giving God glory*. Fewer hands go up. Some songs do it head to toe; some do it in a line or two.\n\nThe takeaway before we go to Scripture: giving glory is a specific act, not a mood. Now — what is the thing being given?\n\n### C · Into the Word — 5 min\n\n**Reader 1 — Psalm 8:5**\n- Who is being crowned? With what?\n- Concept: glory is something God *gives to people.* Not just something God has. Not just something we give Him. Made for it.\n\n**Reader 2 — Romans 1:21–23**\n- What did they know? What did they do with it? What did they trade?\n- Concept: knew God, didn't honor Him, swapped His glory for images. Lost the weight. Took something lighter.\n- Note the two directions in this one passage — *glorify Him* (worship) vs. *the glory of God* (His). Both real. Psalm 8 gave us a third: glory *from* God to us. That's the one we're chasing today.\n\n### D · So what — 5 min\n\nBuilt to carry weight. The weight is gone. Nobody stops wanting it. So everyone gets heavy some other way.\n\n**Ask:** what do people your age trade it for? What's the image?\n- Push past generic. The post, the roster spot, the relationship, the grade, being liked.\n- Three buckets to name once the answers are up: **praise, power, pleasure.**\n- Toy to toy. Fix to fix. Relationship to relationship. It never lands, because it isn't the thing.\n\n**Achilles.** The Greeks idolized kleos. Achilles chose it over a long life — die young at Troy and be remembered forever. Then in the *Odyssey*, Odysseus finds his ghost in the underworld and tries to comfort him: you're honored like a god down here. Achilles says he'd rather be a farmhand for some nobody than king of the dead. The man who picked glory over everything would trade all of it to be alive as a nobody. Counterfeit glory, at the end, weighs nothing.\n\nThe point: glory isn't a church word. It's the thing under every want you have. That's why it matters.\n\n### E · The answer — 3 min\n\n**Reader 3 — Colossians 1:27**\n- Where is glory now, according to Paul?\n- Concept: *Christ in you, the hope of glory.* Not hope in general — hope of *that.* The thing we traded is found in a person.\n\n**Reader 4 — John 1:14**\n- Memory verse. What became visible?\n- Concept: glory took on flesh. You could look at it.\n\n### F · Back to the wall — 2 min\n\n**Reader 5 — Philippians 3:7–8**\n- What did Paul count as loss? What was worth more?\n- Concept: giving glory to God means letting go of the counterfeits and putting the weight on Him alone. That's what \"faithfully worship God\" on the wall means.\n\nChrist, Community, Calling — quick:\n- **Christ** — the weight is on Him. Everything else follows.\n- **Community** — we let go of the fakes *together.* We believe something and can say it. We treat each other like it's true.\n- **Calling** — what you do because of the first two.\n\nThat's the wall. That's who we are.\n\n---\n\n## 9:50 — Prayer wall · 10 min\n\nFirst use. Explain once: one thing each — hard, hoped-for, thankful. Every week, both days, never skipped.\n\nEveryone writes. Read them or let students say them. Pray.\n\n---\n\n## 10:00 — Breakout · 15 min\n\nHigh school → foyer. Jr high → stays.\n\n**5 min silent.** Read Colossians 1:15–28, write answers on the handout.\n\n**10 min discussion.** Leader opens from question 2, not question 1.\n\n**Leader notes**\n- Question 2 is where it goes quiet. Let it.\n- Question 4 is not a test. \"Christian, but not sure about born-again\" is the most useful answer in the room. Ask what they mean. Don't fix it.\n- Jr high: read the passage aloud first.\n- High school: question 5 gets the last few minutes. Let them answer it.\n\n---\n\n## 10:15 — Done\n\nCollect handouts if you want to read them. Worship at 10:30.\n\n---\n\n## Watch-outs\n\n- Don't let glory stay churchy.\n- Order matters more than memorization on the mission — Christ first, community isn't a club. Nobody needs to recite three C's.\n- Section D is the fullest part of the teach. If it runs long, compress the Achilles bit rather than cutting it — one sentence each on the choice and the ghost still lands it.\n- Prayer wall supplies ready before 9:15.\n- Twenty-five minutes is the ceiling on the teach.\n", "file": "SS Week 1 - Glory.md"}, "d07": {"title": "Student Handout · Week 1 — Glory", "nav": "SS Week 1 Handout - Glory", "html": "<h1>Student Handout · Week 1 — Glory</h1>\n<p><strong>Sep 13</strong> · Read Colossians 1:15–28 · Five minutes on your own, then we talk.</p>\n<p><strong>Memory verse:</strong> <em>\"And the Word became flesh and dwelt among us, and we have seen his glory, glory as of the only Son from the Father, full of grace and truth.\"</em> — John 1:14</p>\n<p><strong>1.</strong> Verse 27 says <em>\"Christ in you, the hope of glory.\"</em> Put that in your own words. What do you think it actually means?</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>2.</strong> Praise, power, pleasure — the three counterfeits. Which one is yours? Where do you go looking for the feeling that you matter? Be specific.</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>3.</strong> Finish the sentence honestly: <em>\"I find life satisfaction in glory from God plus <strong><em>_</em></strong><strong><em>_</em></strong><strong><em>_</em></strong>_.\"</em></p>\n<p>&nbsp;</p>\n<p><strong>4.</strong> Journey says a Christian who isn't \"born again\" is like being semi-married — not a real category. Which would you click, and why?</p>\n<p>☐ Not a Christian  ☐ Christian  ☐ Born-again Christian</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>5. (High school)</strong> What would have to be true for this to be a group you'd actually miss if you skipped?</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>", "md": "# Student Handout · Week 1 — Glory\n\n**Sep 13** · Read Colossians 1:15–28 · Five minutes on your own, then we talk.\n\n**Memory verse:** *\"And the Word became flesh and dwelt among us, and we have seen his glory, glory as of the only Son from the Father, full of grace and truth.\"* — John 1:14\n\n**1.** Verse 27 says *\"Christ in you, the hope of glory.\"* Put that in your own words. What do you think it actually means?\n\n&nbsp;\n\n&nbsp;\n\n**2.** Praise, power, pleasure — the three counterfeits. Which one is yours? Where do you go looking for the feeling that you matter? Be specific.\n\n&nbsp;\n\n&nbsp;\n\n**3.** Finish the sentence honestly: *\"I find life satisfaction in glory from God plus ______________________.\"*\n\n&nbsp;\n\n**4.** Journey says a Christian who isn't \"born again\" is like being semi-married — not a real category. Which would you click, and why?\n\n☐ Not a Christian  ☐ Christian  ☐ Born-again Christian\n\n&nbsp;\n\n&nbsp;\n\n**5. (High school)** What would have to be true for this to be a group you'd actually miss if you skipped?\n\n&nbsp;\n\n&nbsp;\n", "file": "SS Week 1 Handout - Glory.md"}, "d08": {"title": "Sunday School · Week 2 — God's Character", "nav": "SS Week 2 - God's Character", "html": "<h1>Sunday School · Week 2 — God's Character</h1>\n<p><strong>Teacher's Guide · Sep 20 · 9:15–10:15</strong>\nJr high + high school combined</p>\n<p><strong>Prep:</strong> Journey Red Year · Knowing God U1, pp. 149. Read before Sunday. Not used in class.\n<strong>Memory verse:</strong> <em>to add</em>\n<strong>In Bible:</strong> <em>to add<

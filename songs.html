<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Fellowship – Worship Songs</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF7A2B;
    --orange-dim: rgba(255,122,43,0.55);
    --orange-glow: rgba(255,122,43,0.15);
    --orange-glow-strong: rgba(255,122,43,0.28);
    --bg: #181c24;
    --bg2: #1f2430;
    --bg3: #232838;
    --card-bg: #1c2130;
    --card-border: rgba(255,255,255,0.07);
    --card-border-hover: rgba(255,122,43,0.45);
    --text: #f0f0f0;
    --text-mid: #a0a8b8;
    --text-dim: #505870;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Montserrat', system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -20%; right: -15%;
    width: 55%; height: 55%;
    background: radial-gradient(ellipse, rgba(255,122,43,0.07) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
    mix-blend-mode: overlay;
  }

  /* ============================
     GRID PAGE
  ============================ */
  #grid-page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 60px 36px 100px;
    max-width: 1140px;
    margin: 0 auto;
  }

  .site-header {
    text-align: center;
    margin-bottom: 52px;
  }
  .site-eyebrow {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .site-title {
    font-size: clamp(2.6rem, 6vw, 4.2rem);
    font-weight: 900;
    color: var(--text);
    letter-spacing: -0.03em;
    line-height: 1.0;
    text-transform: uppercase;
  }
  .site-title span {
    display: inline-block;
    position: relative;
  }
  .site-title span::after {
    content: '';
    position: absolute;
    bottom: -6px; left: 0; right: 0;
    height: 3px;
    background: var(--orange);
    border-radius: 2px;
    box-shadow: 0 0 12px var(--orange-dim);
  }
  .site-sub {
    margin-top: 20px;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* ============================
     THIS WEEK SECTION
  ============================ */
  .this-week-section {
    margin-bottom: 40px;
  }

  .this-week-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .this-week-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--orange);
  }

  .this-week-label::before {
    content: '';
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--orange);
    box-shadow: 0 0 8px var(--orange-dim);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 8px var(--orange-dim); }
    50% { box-shadow: 0 0 16px var(--orange), 0 0 24px rgba(255,122,43,0.3); }
  }

  .clear-btn {
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: rgba(255,122,43,0.08);
    border: 1px solid rgba(255,122,43,0.25);
    color: rgba(255,122,43,0.7);
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .clear-btn:hover {
    background: rgba(255,122,43,0.15);
    color: var(--orange);
    border-color: rgba(255,122,43,0.5);
  }

  .this-week-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  @media (max-width: 780px) { .this-week-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 460px) { .this-week-grid { grid-template-columns: 1fr; } }

  /* Divider between this week and all songs */
  .section-divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }
  .section-divider-line {
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.06);
  }
  .section-divider-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* ============================
     SONG CARDS (shared styles)
  ============================ */
  .song-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  @media (max-width: 780px) { .song-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 460px) {
    .song-grid { grid-template-columns: 1fr; }
    #grid-page { padding: 40px 18px 80px; }
  }

  .song-card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    padding: 20px 20px 18px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.18s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    opacity: 0;
    animation: cardIn 0.35s ease forwards;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .song-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 70% at 80% 10%, var(--orange-glow) 0%, transparent 65%);
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  .song-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--orange), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .song-card:hover {
    background: var(--bg3);
    border-color: var(--card-border-hover);
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.35), 0 0 20px var(--orange-glow);
  }
  .song-card:hover::before { opacity: 1; }
  .song-card:hover::after  { opacity: 0.8; }
  .song-card:active { transform: translateY(-1px); }

  /* Pinned card style */
  .song-card.pinned {
    border-color: rgba(255,122,43,0.35);
    background: #1e1f2e;
  }
  .song-card.pinned::after { opacity: 0.5; }

  .card-inner { position: relative; z-index: 1; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .card-num {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--orange);
    opacity: 0.7;
    margin-top: 1px;
  }

  /* Pin checkbox */
  .pin-btn {
    flex-shrink: 0;
    width: 20px; height: 20px;
    border-radius: 4px;
    border: 1.5px solid rgba(255,255,255,0.12);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    z-index: 5;
  }
  .pin-btn:hover {
    border-color: var(--orange);
    background: rgba(255,122,43,0.1);
  }
  .pin-btn.checked {
    border-color: var(--orange);
    background: var(--orange);
  }
  .pin-btn .check-icon {
    opacity: 0;
    color: #fff;
    font-size: 11px;
    font-weight: 900;
    line-height: 1;
    transition: opacity 0.15s;
  }
  .pin-btn.checked .check-icon { opacity: 1; }

  .card-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 5px;
    letter-spacing: -0.01em;
  }
  .card-artist {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  /* Empty state for this week */
  .this-week-empty {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    padding: 18px 0 4px;
    text-align: center;
    opacity: 0.6;
  }

  /* ============================
     SLIDESHOW
  ============================ */
  #slideshow-page {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    flex-direction: column;
  }
  #slideshow-page.active { display: flex; }

  .slide-bg { position: absolute; inset: 0; z-index: 0; }
  .slide-bg-base   { position: absolute; inset: 0; }
  .slide-bg-bloom1 { position: absolute; top: -20%; right: -8%;  width: 70%; height: 78%; filter: blur(60px); }
  .slide-bg-bloom2 { position: absolute; bottom: -15%; left: -5%; width: 60%; height: 60%; filter: blur(65px); }
  .slide-bg-bloom3 { position: absolute; top: 20%; left: 15%; width: 70%; height: 60%; filter: blur(80px); opacity: 0.4; }
  .slide-bg-streak { position: absolute; top: 46%; left: 0; right: 0; height: 2px; filter: blur(2px); opacity: 0.25; }

  #slideshow-page.upbeat .slide-bg-base   { background: #1a1408; }
  #slideshow-page.upbeat .slide-bg-bloom1 { background: radial-gradient(ellipse at 65% 25%, rgba(255,160,40,0.35) 0%, transparent 70%); }
  #slideshow-page.upbeat .slide-bg-bloom2 { background: radial-gradient(ellipse at 30% 75%, rgba(255,122,43,0.18) 0%, transparent 65%); }
  #slideshow-page.upbeat .slide-bg-bloom3 { background: radial-gradient(ellipse at 50% 50%, rgba(255,190,80,0.10) 0%, transparent 60%); }
  #slideshow-page.upbeat .slide-bg-streak { background: linear-gradient(90deg, transparent, rgba(255,170,60,0.5), transparent); }
  #slideshow-page.upbeat .ss-accent       { color: #FFB347; }
  #slideshow-page.upbeat .dot.active      { background: #FFB347; box-shadow: 0 0 8px rgba(255,179,71,0.6); }
  #slideshow-page.upbeat .nav-arrow:hover:not(:disabled) { border-color: #FFB347; color: #FFB347; }
  #slideshow-page.upbeat .close-btn:hover { border-color: #FFB347; color: #FFB347; }

  #slideshow-page.gentle .slide-bg-base   { background: #0e1420; }
  #slideshow-page.gentle .slide-bg-bloom1 { background: radial-gradient(ellipse at 65% 25%, rgba(100,160,240,0.28) 0%, transparent 70%); }
  #slideshow-page.gentle .slide-bg-bloom2 { background: radial-gradient(ellipse at 30% 75%, rgba(80,140,220,0.15) 0%, transparent 65%); }
  #slideshow-page.gentle .slide-bg-bloom3 { background: radial-gradient(ellipse at 50% 50%, rgba(120,180,255,0.08) 0%, transparent 60%); }
  #slideshow-page.gentle .slide-bg-streak { background: linear-gradient(90deg, transparent, rgba(120,180,255,0.4), transparent); }
  #slideshow-page.gentle .ss-accent       { color: #7EB8F7; }
  #slideshow-page.gentle .dot.active      { background: #7EB8F7; box-shadow: 0 0 8px rgba(126,184,247,0.6); }
  #slideshow-page.gentle .nav-arrow:hover:not(:disabled) { border-color: #7EB8F7; color: #7EB8F7; }
  #slideshow-page.gentle .close-btn:hover { border-color: #7EB8F7; color: #7EB8F7; }

  #slideshow-page.somber .slide-bg-base   { background: #160e10; }
  #slideshow-page.somber .slide-bg-bloom1 { background: radial-gradient(ellipse at 65% 25%, rgba(210,90,110,0.30) 0%, transparent 70%); }
  #slideshow-page.somber .slide-bg-bloom2 { background: radial-gradient(ellipse at 30% 75%, rgba(190,80,100,0.16) 0%, transparent 65%); }
  #slideshow-page.somber .slide-bg-bloom3 { background: radial-gradient(ellipse at 50% 50%, rgba(220,110,130,0.08) 0%, transparent 60%); }
  #slideshow-page.somber .slide-bg-streak { background: linear-gradient(90deg, transparent, rgba(220,110,130,0.4), transparent); }
  #slideshow-page.somber .ss-accent       { color: #E8889A; }
  #slideshow-page.somber .dot.active      { background: #E8889A; box-shadow: 0 0 8px rgba(232,136,154,0.6); }
  #slideshow-page.somber .nav-arrow:hover:not(:disabled) { border-color: #E8889A; color: #E8889A; }
  #slideshow-page.somber .close-btn:hover { border-color: #E8889A; color: #E8889A; }

  .slide-header {
    position: relative; z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(14px);
    flex-shrink: 0;
  }
  .slide-song-info { display: flex; flex-direction: column; gap: 3px; }
  .slide-song-title {
    font-size: 0.9rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text);
  }
  .slide-song-artist {
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }
  .close-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.4);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 7px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .close-btn:hover { background: rgba(255,255,255,0.08); }

  .slide-stage {
    flex: 1;
    position: relative; z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 90px;
    overflow: hidden;
  }
  .slide-content {
    text-align: center;
    max-width: 860px;
    width: 100%;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .slide-content.fade-out { opacity: 0; transform: translateY(8px); }

  .slide-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    opacity: 0.65;
    margin-bottom: 28px;
  }
  .slide-lyrics {
    font-size: clamp(1.8rem, 4vw, 3rem);
    font-weight: 800;
    color: #ffffff;
    line-height: 1.55;
    letter-spacing: -0.01em;
    white-space: pre-line;
    text-shadow: 0 2px 40px rgba(0,0,0,0.6);
    text-transform: uppercase;
  }

  .nav-arrow {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.09);
    color: rgba(255,255,255,0.3);
    font-size: 1.2rem;
    cursor: pointer;
    width: 46px; height: 46px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    z-index: 20;
    user-select: none;
    backdrop-filter: blur(6px);
  }
  .nav-arrow:hover:not(:disabled) { background: rgba(255,255,255,0.1); transform: translateY(-50%) scale(1.1); }
  .nav-arrow:disabled { opacity: 0.1; cursor: default; }
  .nav-arrow.prev { left: 18px; }
  .nav-arrow.next { right: 18px; }

  .slide-footer {
    position: relative; z-index: 10;
    padding: 12px 24px 22px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(14px);
    border-top: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
  }
  .dot-nav {
    display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; max-width: 540px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.16);
    cursor: pointer; border: none; padding: 0;
    transition: background 0.2s, transform 0.22s, width 0.25s, border-radius 0.25s;
  }
  .dot.active { transform: scale(1.2); width: 20px; border-radius: 3px; }
  .dot:hover:not(.active) { background: rgba(255,255,255,0.35); }
  .slide-counter {
    font-size: 0.68rem; font-weight: 600; letter-spacing: 0.14em; color: rgba(255,255,255,0.2);
  }
</style>
</head>
<body>

<div id="grid-page">
  <header class="site-header">
    <div class="site-eyebrow">Christ Presbyterian Church &middot; Georgetown TX</div>
    <h1 class="site-title"><span>Worship Songs</span></h1>
    <p class="site-sub">Select a song to open lyrics</p>
  </header>

  <!-- THIS WEEK -->
  <div class="this-week-section" id="this-week-section" style="display:none">
    <div class="this-week-header">
      <div class="this-week-label">This Week</div>
      <button class="clear-btn" id="clear-all-btn">Clear All</button>
    </div>
    <div class="this-week-grid" id="this-week-grid"></div>
  </div>

  <!-- DIVIDER -->
  <div class="section-divider" id="all-songs-divider" style="display:none">
    <div class="section-divider-line"></div>
    <div class="section-divider-label">All Songs</div>
    <div class="section-divider-line"></div>
  </div>

  <div class="song-grid" id="song-grid"></div>
</div>

<div id="slideshow-page">
  <div class="slide-bg">
    <div class="slide-bg-base"></div>
    <div class="slide-bg-bloom1"></div>
    <div class="slide-bg-bloom2"></div>
    <div class="slide-bg-bloom3"></div>
    <div class="slide-bg-streak"></div>
  </div>
  <div class="slide-header">
    <div class="slide-song-info">
      <div class="slide-song-title" id="ss-title"></div>
      <div class="slide-song-artist" id="ss-artist"></div>
    </div>
    <button class="close-btn" id="close-btn">✕ Close</button>
  </div>
  <div class="slide-stage">
    <button class="nav-arrow prev" id="prev-btn">&#8592;</button>
    <div class="slide-content" id="slide-content">
      <div class="slide-label ss-accent" id="slide-label"></div>
      <div class="slide-lyrics" id="slide-lyrics"></div>
    </div>
    <button class="nav-arrow next" id="next-btn">&#8594;</button>
  </div>
  <div class="slide-footer">
    <div class="dot-nav" id="dot-nav"></div>
    <div class="slide-counter" id="slide-counter"></div>
  </div>
</div>

// ── Pinned state (localStorage) ──
const STORAGE_KEY = 'fellowship_pinned';

function loadPinned() {
  try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)) || []); }
  catch { return new Set(); }
}
function savePinned(set) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...set]));
}

let pinned = loadPinned();

// ── Render everything ──
function renderAll() {
  renderThisWeek();
  renderGrid();
}

function makeCard(songIndex, inThisWeek = false) {
  const song = SONGS[songIndex];
  const isPinned = pinned.has(songIndex);
  const card = document.createElement('div');
  card.className = 'song-card' + (isPinned ? ' pinned' : '');
  card.style.animationDelay = `${songIndex * 0.035}s`;
  card.dataset.index = songIndex;

  card.innerHTML = `
    <div class="card-inner">
      <div class="card-top">
        <div class="card-num">${String(songIndex + 1).padStart(2,'0')}</div>
        <button class="pin-btn ${isPinned ? 'checked' : ''}" title="${isPinned ? 'Remove from This Week' : 'Add to This Week'}">
          <span class="check-icon">✓</span>
        </button>
      </div>
      <div class="card-title">${song.title}</div>
      <div class="card-artist">${song.artist}</div>
    </div>
  `;

  // Pin button — toggle, don't open slideshow
  card.querySelector('.pin-btn').addEventListener('click', e => {
    e.stopPropagation();
    togglePin(songIndex);
  });

  // Card body — open slideshow
  card.addEventListener('click', () => openSlideshow(songIndex));

  return card;
}

function renderThisWeek() {
  const section   = document.getElementById('this-week-section');
  const twGrid    = document.getElementById('this-week-grid');
  const divider   = document.getElementById('all-songs-divider');
  twGrid.innerHTML = '';

  if (pinned.size === 0) {
    section.style.display = 'none';
    divider.style.display = 'none';
    return;
  }

  section.style.display = 'block';
  divider.style.display = 'flex';

  [...pinned].forEach(idx => {
    twGrid.appendChild(makeCard(idx, true));
  });
}

function renderGrid() {
  const grid = document.getElementById('song-grid');
  grid.innerHTML = '';
  SONGS.forEach((_, i) => {
    grid.appendChild(makeCard(i, false));
  });
}

function togglePin(idx) {
  if (pinned.has(idx)) {
    pinned.delete(idx);
  } else {
    pinned.add(idx);
  }
  savePinned(pinned);
  renderAll();
}

document.getElementById('clear-all-btn').addEventListener('click', () => {
  pinned.clear();
  savePinned(pinned);
  renderAll();
});

// ── Slideshow ──
let currentSong = 0, currentSlide = 0;
const slideshowPage = document.getElementById('slideshow-page');
const ssTitle      = document.getElementById('ss-title');
const ssArtist     = document.getElementById('ss-artist');
const slideContent = document.getElementById('slide-content');
const slideLabel   = document.getElementById('slide-label');
const slideLyrics  = document.getElementById('slide-lyrics');
const dotNav       = document.getElementById('dot-nav');
const slideCounter = document.getElementById('slide-counter');
const prevBtn      = document.getElementById('prev-btn');
const nextBtn      = document.getElementById('next-btn');

function openSlideshow(idx) {
  currentSong = idx; currentSlide = 0;
  const song = SONGS[idx];
  ssTitle.textContent  = song.title;
  ssArtist.textContent = song.artist;
  slideshowPage.className = 'active ' + song.mood;
  buildDots();
  renderSlide(false);
  document.body.style.overflow = 'hidden';
}

function closeSlideshow() {
  slideshowPage.className = '';
  document.body.style.overflow = '';
}

function buildDots() {
  dotNav.innerHTML = '';
  SONGS[currentSong].slides.forEach((_, i) => {
    const d = document.createElement('button');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.addEventListener('click', () => goToSlide(i));
    dotNav.appendChild(d);
  });
}

function renderSlide(animate = true) {
  const song  = SONGS[currentSong];
  const slide = song.slides[currentSlide];
  const doUpdate = () => {
    slideLabel.textContent  = slide.label;
    slideLyrics.textContent = slide.lyrics;
    slideContent.classList.remove('fade-out');
    dotNav.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide));
    slideCounter.textContent = `${currentSlide + 1} / ${song.slides.length}`;
    prevBtn.disabled = currentSlide === 0;
    nextBtn.disabled = currentSlide === song.slides.length - 1;
  };
  if (animate) { slideContent.classList.add('fade-out'); setTimeout(doUpdate, 215); }
  else doUpdate();
}

function goToSlide(i) {
  if (i < 0 || i >= SONGS[currentSong].slides.length) return;
  currentSlide = i; renderSlide(true);
}

document.getElementById('close-btn').addEventListener('click', closeSlideshow);
prevBtn.addEventListener('click', () => goToSlide(currentSlide - 1));
nextBtn.addEventListener('click', () => goToSlide(currentSlide + 1));
document.addEventListener('keydown', e => {
  if (!slideshowPage.classList.contains('active')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goToSlide(currentSlide + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goToSlide(currentSlide - 1);
  if (e.key === 'Escape') closeSlideshow();
});

// Init
renderAll();
</script>
